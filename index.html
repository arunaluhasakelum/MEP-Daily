<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEP Daily — Field Notes</title>
<meta name="theme-color" content="#0A2647">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEP Daily">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0A2647;
  --bg-deep:#071A33;
  --paper:#0F3460;
  --paper-2:#123a6e;
  --line:#2C5F8A;
  --ink:#DCEEFB;
  --ink-dim:#8FB4D4;
  --ink-faint:#5D85AA;
  --accent:#F2994A;
  --accent-2:#E8B14E;
  --good:#6FCF97;
  --bad:#EB6B6B;
  --mono:'JetBrains Mono', monospace;
  --sans:'Inter', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(0deg, rgba(220,238,251,0.035) 0px, rgba(220,238,251,0.035) 1px, transparent 1px, transparent 28px),
    repeating-linear-gradient(90deg, rgba(220,238,251,0.035) 0px, rgba(220,238,251,0.035) 1px, transparent 1px, transparent 28px),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  font-family:var(--sans);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  padding-bottom:78px;
}

/* ---------- Title block header ---------- */
.titleblock{
  margin:14px 12px 10px;
  border:1.5px solid var(--line);
  background:rgba(15,52,96,0.55);
  border-radius:4px;
  overflow:hidden;
}
.tb-row{display:flex; border-bottom:1px solid var(--line);}
.tb-row:last-child{border-bottom:none;}
.tb-cell{flex:1; padding:8px 10px; border-right:1px solid var(--line);}
.tb-cell:last-child{border-right:none;}
.tb-label{font-family:var(--mono); font-size:9px; letter-spacing:0.08em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:2px;}
.tb-value{font-family:var(--mono); font-size:15px; font-weight:700; color:var(--ink);}
.tb-value.accent{color:var(--accent);}
.tb-title{padding:10px 12px; display:flex; align-items:center; justify-content:space-between;}
.tb-title h1{font-family:var(--mono); font-size:13px; letter-spacing:0.12em; margin:0; color:var(--ink); text-transform:uppercase;}
.tb-title .sub{font-family:var(--mono); font-size:9px; color:var(--ink-faint); letter-spacing:0.06em;}

/* corner crosshair marks */
.crosshair{position:absolute; width:10px; height:10px; pointer-events:none;}
.crosshair::before,.crosshair::after{content:'';position:absolute;background:var(--line);}
.crosshair::before{width:100%;height:1px;top:50%;}
.crosshair::after{width:1px;height:100%;left:50%;}
.ch-tl{top:6px;left:6px;} .ch-tr{top:6px;right:6px;} .ch-bl{bottom:6px;left:6px;} .ch-br{bottom:6px;right:6px;}

/* ---------- Nav tabs ---------- */
.tabs{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  display:flex; background:var(--bg-deep);
  border-top:1.5px solid var(--line);
  z-index:50;
}
.tab{
  flex:1; padding:12px 4px 10px; text-align:center; background:none; border:none;
  color:var(--ink-faint); font-family:var(--mono); font-size:10px; letter-spacing:0.06em;
  text-transform:uppercase; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
}
.tab.active{color:var(--accent);}
.tab-icon{width:18px; height:18px;}

/* ---------- Content area ---------- */
.view{padding:6px 12px 20px; flex:1;}
.section-label{font-family:var(--mono); font-size:10px; letter-spacing:0.1em; color:var(--ink-faint); text-transform:uppercase; margin:18px 0 8px 2px; overflow:hidden; display:flex; align-items:center; justify-content:space-between;}

/* ---------- Cards ---------- */
.card{
  position:relative;
  background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
  border:1.5px solid var(--line);
  border-radius:6px;
  padding:18px;
  margin-bottom:12px;
}
.card .cat-tag{
  display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:0.1em;
  color:var(--accent); border:1px solid var(--accent); border-radius:20px; padding:2px 8px; margin-bottom:10px; text-transform:uppercase;
}
.card .type-tag{
  display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:0.1em;
  color:var(--ink-faint); margin-bottom:10px; margin-left:6px; text-transform:uppercase;
}
.card h2{font-family:var(--sans); font-size:16px; font-weight:600; margin:0 0 12px; line-height:1.4; color:var(--ink);}
.card p.body{font-size:14px; line-height:1.6; color:var(--ink-dim); margin:0 0 14px;}

.opt{
  display:block; width:100%; text-align:left; background:rgba(220,238,251,0.04);
  border:1.3px solid var(--line); color:var(--ink); font-family:var(--sans); font-size:14px;
  padding:11px 13px; border-radius:5px; margin-bottom:8px; cursor:pointer; transition:all .15s;
}
.opt:active{transform:scale(0.98);}
.opt.correct{border-color:var(--good); background:rgba(111,207,151,0.14); color:var(--good);}
.opt.wrong{border-color:var(--bad); background:rgba(235,107,107,0.14); color:var(--bad);}
.opt.dim{opacity:0.4;}
.explain{
  margin-top:12px; padding:12px; background:rgba(0,0,0,0.18); border-left:3px solid var(--accent);
  border-radius:3px; font-size:13px; line-height:1.55; color:var(--ink-dim);
}
.explain b{color:var(--accent-2);}

.figure{margin:4px 0 14px; border:1.3px dashed var(--line); border-radius:5px; overflow:hidden; background:rgba(0,0,0,0.15); position:relative;}
.figure img{width:100%; display:block; max-height:220px; object-fit:cover;}
.fig-loading{padding:22px 10px; text-align:center; font-family:var(--mono); font-size:10px; color:var(--ink-faint); letter-spacing:0.05em; text-transform:uppercase;}
.fig-cap{font-family:var(--mono); font-size:9px; letter-spacing:0.06em; color:var(--ink-faint); padding:6px 10px; text-transform:uppercase; border-top:1px solid var(--line); background:rgba(0,0,0,0.2);}
.dd-badge{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--good); margin-right:6px; box-shadow:0 0 6px var(--good);}
.card .type-tag.code-tag{color:var(--accent-2); border:1px solid var(--accent-2); border-radius:20px; padding:2px 8px;}
.fig-retry{cursor:pointer; color:var(--accent); border-top:1px dashed var(--line);}
.fig-retry:active{opacity:0.6;}
.refresh-btn{background:none; border:1px solid var(--line); color:var(--ink-dim); font-family:var(--mono); font-size:9px; letter-spacing:0.05em; text-transform:uppercase; padding:3px 9px; border-radius:20px; cursor:pointer; flex-shrink:0;}
.refresh-btn:active{transform:scale(0.95); opacity:0.7;}

/* flashcard */
.flashwrap{perspective:1000px; margin-bottom:12px;}
.flashcard{
  position:relative; min-height:170px; border-radius:6px; cursor:pointer;
  transform-style:preserve-3d; transition:transform .5s;
}
.flashcard.flip{transform:rotateY(180deg);}
.fcface{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:6px;
  border:1.5px solid var(--line); padding:18px; display:flex; flex-direction:column; justify-content:center;
  background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
}
.fcface.back{transform:rotateY(180deg); background:linear-gradient(160deg, #123a6e 0%, #0d2b52 100%); border-color:var(--accent);}
.fcface .hint{font-family:var(--mono); font-size:9px; letter-spacing:0.1em; color:var(--ink-faint); position:absolute; bottom:10px; right:14px; text-transform:uppercase;}
.fcface .txt{font-size:16px; line-height:1.5; color:var(--ink); font-weight:600;}
.fcface.back .txt{font-size:14px; font-weight:400; color:var(--ink-dim);}

.rate-row{display:flex; gap:8px; margin-top:4px;}
.rate-btn{flex:1; padding:10px; border-radius:5px; border:1.3px solid var(--line); background:rgba(220,238,251,0.04); color:var(--ink-dim); font-family:var(--mono); font-size:11px; letter-spacing:0.04em; text-transform:uppercase; cursor:pointer;}
.rate-btn.hard{border-color:var(--bad); color:var(--bad);}
.rate-btn.easy{border-color:var(--good); color:var(--good);}

.btn{
  width:100%; padding:13px; border-radius:5px; border:none; background:var(--accent); color:#1a1005;
  font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; margin-top:6px;
}
.btn:active{transform:scale(0.98);}
.btn.ghost{background:transparent; border:1.3px solid var(--line); color:var(--ink-dim);}

.progressbar{height:5px; background:rgba(220,238,251,0.08); border-radius:3px; overflow:hidden; margin:12px 2px 4px;}
.progressbar-fill{height:100%; background:var(--accent); transition:width .3s;}
.progress-txt{font-family:var(--mono); font-size:10px; color:var(--ink-faint); text-align:right; letter-spacing:0.05em;}

/* stats */
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.statbox{border:1.5px solid var(--line); border-radius:6px; padding:14px; background:rgba(15,52,96,0.4);}
.statbox .n{font-family:var(--mono); font-size:26px; font-weight:800; color:var(--accent);}
.statbox .l{font-family:var(--mono); font-size:9px; letter-spacing:0.08em; color:var(--ink-faint); text-transform:uppercase; margin-top:2px;}

.catbar-row{margin-bottom:12px;}
.catbar-head{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; margin-bottom:5px;}
.catbar-head span:first-child{color:var(--ink); letter-spacing:0.04em;}
.catbar-head span:last-child{color:var(--ink-faint);}
.catbar-track{height:8px; background:rgba(220,238,251,0.08); border-radius:4px; overflow:hidden;}
.catbar-fill{height:100%; background:linear-gradient(90deg, var(--accent-2), var(--accent));}

.calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:6px;}
.cal-cell{aspect-ratio:1; border-radius:3px; background:rgba(220,238,251,0.06); border:1px solid var(--line);}
.cal-cell.done{background:var(--accent); border-color:var(--accent);}
.cal-cell.today{outline:1.5px solid var(--ink);}

/* explore */
.catgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

/* ---------- Launcher (app switcher) screen ---------- */
.launcher-head{
  position:relative; margin:20px 14px 16px; padding:22px 16px;
  border:1.5px solid var(--line); border-radius:6px; background:rgba(15,52,96,0.5); text-align:center;
}
.launcher-head h1{font-family:var(--mono); font-size:20px; letter-spacing:0.12em; color:var(--ink); margin:0 0 6px;}
.launcher-head .sub{font-family:var(--mono); font-size:9px; letter-spacing:0.1em; color:var(--ink-faint); text-transform:uppercase;}
.disc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px 24px;}
.disc-card{
  border:1.5px solid var(--line); border-radius:6px; padding:20px 12px; text-align:left; cursor:pointer;
  background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%); color:var(--ink); font-family:var(--sans);
}
.disc-card:active{transform:scale(0.97);}
.disc-ic{font-size:26px; margin-bottom:10px; display:block;}
.disc-nm{font-weight:700; font-size:13px; line-height:1.3;}
.disc-sub{font-family:var(--mono); font-size:9px; color:var(--ink-faint); margin-top:6px; text-transform:uppercase; letter-spacing:0.05em;}
.back-chip{
  background:none; border:1px solid var(--line); color:var(--ink-dim); border-radius:50%; width:22px; height:22px;
  font-size:12px; line-height:1; cursor:pointer; vertical-align:middle; margin-right:4px; padding:0;
}
.back-chip:active{transform:scale(0.9);}
.catcard{
  border:1.5px solid var(--line); border-radius:6px; padding:16px 12px; text-align:left; cursor:pointer;
  background:rgba(15,52,96,0.4); color:var(--ink); font-family:var(--sans);
}
.catcard .ic{font-size:22px; margin-bottom:8px; display:block;}
.catcard .nm{font-weight:700; font-size:13px;}
.catcard .cnt{font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:2px;}

.backbtn{background:none; border:none; color:var(--ink-dim); font-family:var(--mono); font-size:11px; letter-spacing:0.05em; padding:6px 0 14px; cursor:pointer; display:flex; align-items:center; gap:6px;}

.empty-state{text-align:center; padding:40px 20px; color:var(--ink-faint); font-family:var(--mono); font-size:12px; line-height:1.7;}

.done-banner{text-align:center; padding:30px 16px;}
.done-banner .big{font-size:40px; margin-bottom:10px;}
.done-banner h3{font-family:var(--mono); font-size:15px; letter-spacing:0.06em; color:var(--accent); text-transform:uppercase; margin:0 0 8px;}
.done-banner p{color:var(--ink-dim); font-size:13px; line-height:1.6;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= DISCIPLINE BANK ================= */
/* DISCIPLINES is injected per-build: { key: { name, short, icon, prefix, ddIntro, ddEnum, cats:{...}, content:[...], imgQuery:{...} } } */
const DISCIPLINES = {
  fire: {
    name: "Fire Protection & Detection Daily",
    short: "Fire",
    icon: "\ud83d\udd25",
    prefix: "fireapp",
    ddIntro: "You are a fire protection engineering trainer writing for an experienced MEP engineer who designs fire detection, suppression, and life-safety systems for resort/hospitality buildings.",
    ddEnum: "DETECT|SUPPRESS|PUMPS|STANDPIPE|GASEOUS|CODES",
    cats: {
    DETECT:{name:'Detection & Alarm', icon:'🔔'},
    SUPPRESS:{name:'Sprinklers & Suppression', icon:'💦'},
    PUMPS:{name:'Fire Pumps & Water Supply', icon:'🚰'},
    STANDPIPE:{name:'Standpipe, Hydrants & Hose', icon:'🧯'},
    GASEOUS:{name:'Gaseous & Special Suppression', icon:'🌫'},
    CODES:{name:'Codes & Standards', icon:'📖'},
  },
    imgQuery: {
  1:'smoke detector',2:'heat detector fire',3:'fire alarm control panel',4:'fire alarm system',5:'beam smoke detector',6:'addressable fire alarm',
  7:'fire sprinkler system',8:'sprinkler installation',9:'dry pipe sprinkler valve',10:'deluge valve',11:'sprinkler head glass bulb',12:'fire sprinkler pipe',
  13:'pre-action sprinkler valve',14:'fire pump',15:'fire pump room',16:'jockey pump',17:'diesel fire pump',18:'fire pump relief valve',
  19:'standpipe fire protection',20:'fire hydrant',21:'standpipe hose cabinet',22:'OS&Y valve',23:'post indicator valve',
  24:'clean agent fire suppression',25:'FM-200 fire suppression',26:'fire detection cross zone',27:'fire escape stairs',
  28:'means of egress',29:'fire department connection',30:'alarm check valve',31:'sprinkler test valve',
  },
    content: [
{id:1,cat:'DETECT',type:'mcq',q:'Ionization vs photoelectric smoke detectors — which generally responds faster to a smoldering (slow, smoky) fire?',opts:['Ionization','Photoelectric','Both respond identically','Neither detects smoldering fires'],a:1,e:'Photoelectric detectors sense light scatter from larger smoke particles typical of smoldering fires, giving faster response. Ionization detectors tend to respond faster to fast-flaming fires with smaller combustion particles.'},
{id:2,cat:'DETECT',type:'flash',f:'What does a rate-of-rise heat detector actually trigger on?',b:'It triggers when temperature rises faster than a set rate per minute (rather than a fixed absolute temperature), catching a developing fire earlier than a fixed-temperature detector alone — often combined with a fixed-temperature backup element.'},
{id:3,cat:'DETECT',type:'mcq',q:'What is the core function of a Fire Alarm Control Panel (FACP)?',opts:['It only sounds an audible alarm, nothing else','It monitors detection/alarm devices, processes signals, and initiates outputs (alarms, notification, and fire system interfaces) per programmed logic',"It replaces the need for sprinklers",'It only logs events for insurance purposes'],a:1,e:'The FACP is the brain of the system — it supervises circuits, interprets inputs from detectors/pull stations, and triggers outputs like notification appliances, damper closures, elevator recall, and interfaces to suppression systems.'},
{id:4,cat:'DETECT',type:'code',standard:'NFPA 72',f:'What does NFPA 72 govern?',b:'The National Fire Alarm and Signaling Code — it governs the design, installation, testing, and maintenance of fire alarm and signaling systems, including detection, notification, and emergency communication.'},
{id:5,cat:'DETECT',type:'flash',f:'When are beam (projected) smoke detectors preferred over point detectors?',b:'In large open, tall spaces — atria, warehouses, ballrooms — where installing many point detectors would be impractical. A beam detector spans a long path and detects smoke obscuring the beam across the space.'},
{id:6,cat:'DETECT',type:'mcq',q:'Addressable vs conventional fire alarm systems — what is the key practical difference?',opts:['Addressable systems cost less to install always','Addressable systems identify the exact device that triggered an alarm; conventional systems only identify the zone/circuit','Conventional systems are wireless, addressable are wired','There is no meaningful difference'],a:1,e:'In an addressable system each device has a unique address reported to the panel, pinpointing exactly which detector or pull station activated — much faster response than a conventional zone-based system that only narrows it to a circuit covering multiple devices.'},
{id:7,cat:'SUPPRESS',type:'mcq',q:'Per NFPA 13, what determines allowable sprinkler spacing and coverage area?',opts:['A single fixed spacing regardless of hazard','Hazard classification (light/ordinary/extra hazard) and sprinkler type, which set maximum protection area per head and max spacing','Only the ceiling height','Only the pipe diameter available'],a:1,e:'NFPA 13 sets maximum coverage area per sprinkler and spacing limits that vary by hazard classification and sprinkler characteristics, ensuring each head adequately wets its protection area.'},
{id:8,cat:'SUPPRESS',type:'code',standard:'NFPA 13',f:'What does NFPA 13 govern?',b:'The Standard for the Installation of Sprinkler Systems — it governs design, layout, hydraulic calculation, and installation of automatic sprinkler systems across hazard classifications.'},
{id:9,cat:'SUPPRESS',type:'flash',f:'Wet pipe vs dry pipe sprinkler systems — when is a dry system required?',b:'Wet pipe (water-filled, fastest response) is the default. Dry pipe (pressurized air holding back water at a dry valve) is used where freezing is possible — unheated spaces, cold storage — since water sitting in the pipe would freeze and burst it.'},
{id:10,cat:'SUPPRESS',type:'mcq',q:'What triggers a deluge valve to release water to all open heads/nozzles simultaneously?',opts:['Manual activation only','A separate fire detection system (heat/smoke/flame), since deluge nozzles are open with no individual heat-sensitive trigger','Water pressure drop alone','A time delay after building occupancy'],a:1,e:'Because deluge nozzles have no individual triggering element, a separate detection system must open the deluge valve, flooding the entire protected zone at once — used where instant total coverage is needed (high-hazard areas).'},
{id:11,cat:'SUPPRESS',type:'flash',f:'Why are sprinkler bulb/link colors coded by temperature rating?',b:'The color (e.g. orange 57°C, red 68°C, yellow 79°C, green 93°C, blue 141°C) lets installers and inspectors instantly verify the correct temperature-rated head is used for the area\'s expected ambient/ceiling temperature — critical near kitchens, boiler rooms, etc.'},
{id:12,cat:'SUPPRESS',type:'code',standard:'BS EN 12845',f:'What is BS EN 12845 and where is it commonly used?',b:'The European standard for fixed firefighting systems — automatic sprinkler systems (design and installation). It\'s widely used on international, Gulf, and Asian hospitality/resort projects as an alternative or complement to NFPA 13.'},
{id:13,cat:'SUPPRESS',type:'lesson',ti:'Pre-action sprinkler systems',bd:'Pre-action systems combine the reliability of a dry system (no standing water in pipes, so accidental head damage doesn\'t discharge water) with an electric fire detection trigger that must activate before the valve admits water into the pipe network — giving two independent events required before discharge. Commonly used in sensitive areas like data centers, museums, and archive rooms.',q:'Why are pre-action systems favored in areas like server rooms or archives?',opts:['They are cheaper than wet systems','They require two independent triggers (detection, then a sprinkler activating) before water is released, minimizing accidental water damage risk','They use foam instead of water','They don\'t require any detection system'],a:1,e:'The double-interlock/single-interlock pre-action logic means water only enters the pipe network after fire detection confirms a real event, then still requires an individual head to open — sharply reducing the chance of accidental discharge from mechanical damage to a head.'},
{id:14,cat:'PUMPS',type:'mcq',q:'What is the purpose of a fire pump churn (no-flow/shutoff) test?',opts:['To test the fire alarm panel','To verify the pump can safely run at zero flow (shutoff head) without overheating and confirm rated shutoff pressure','To calibrate sprinkler heads','To test the jockey pump only'],a:1,e:'The churn test runs the fire pump against a closed valve to verify shutoff pressure matches the pump curve and confirms the pump (and its relief/minimum-flow valve) handles no-flow conditions safely.'},
{id:15,cat:'PUMPS',type:'code',standard:'NFPA 20',f:'What does NFPA 20 govern?',b:'The Standard for the Installation of Stationary Pumps for Fire Protection — governs selection, installation, and testing of fire pumps, drivers, and controllers.'},
{id:16,cat:'PUMPS',type:'flash',f:'What is a jockey pump for?',b:'A small pump that maintains system pressure against minor leaks/pressure fluctuations, preventing the much larger main fire pump from cycling on and off unnecessarily for tiny pressure drops.'},
{id:17,cat:'PUMPS',type:'mcq',q:'Why do fire pump rooms typically need both an electric pump and a diesel-driven backup pump?',opts:['Purely for redundant plumbing connections','Redundancy against loss of electrical power during a fire event — a diesel pump runs independently of the building/grid electrical supply','Diesel pumps are always cheaper to run','Electric pumps cannot achieve high enough pressure'],a:1,e:'A diesel-driven pump ensures water supply continuity if grid power fails during a fire — a realistic scenario, since fires often coincide with or cause electrical faults.'},
{id:18,cat:'PUMPS',type:'flash',f:'Why does a fire pump discharge sometimes need a pressure relief valve per NFPA 20?',b:'Centrifugal fire pumps produce their highest discharge pressure at shutoff (churn) or low-flow conditions. If that exceeds the rated working pressure of downstream piping/components, a relief valve bypasses excess flow back to suction/tank to cap the pressure.'},
{id:19,cat:'STANDPIPE',type:'flash',f:'What is the difference between standpipe Class I, II, and III systems?',b:'Class I: 65mm (2.5") hose connections for fire department use only. Class II: 38mm (1.5") hose stations for trained occupant use. Class III: combines both — connections for fire dept. plus hose stations for occupants.'},
{id:20,cat:'STANDPIPE',type:'mcq',q:'What is the key functional difference between a hose reel and a fire hydrant landing valve?',opts:['No difference, same equipment','Hose reels are small-bore, fixed-hose, occupant-use first-response devices; hydrant landing valves supply large-bore hose for fire brigade use','Hydrants are only for outdoor use','Hose reels only work with foam'],a:1,e:'Hose reels (typically 25mm, fixed rubber hose) let occupants tackle a fire at incipient stage. Hydrant/landing valve outlets (65mm) supply canvas hose for trained fire brigade personnel delivering much higher flow.'},
{id:21,cat:'STANDPIPE',type:'code',standard:'NFPA 14',f:'What does NFPA 14 govern?',b:'The Standard for the Installation of Standpipe and Hose Systems — governs design, sizing, and installation of standpipe systems and their hose connections.'},
{id:22,cat:'STANDPIPE',type:'flash',f:'OS&Y valve — what does it stand for and why is it used on fire mains?',b:'Outside Screw and Yoke. The valve stem is visible outside the body, showing at a glance whether the valve is open or closed — critical for isolation valves on fire protection mains that must never be unknowingly left closed.'},
{id:23,cat:'STANDPIPE',type:'flash',f:'PIV — what does it stand for in fire protection?',b:'Post Indicator Valve. An underground gate valve with an above-ground indicator post showing OPEN/SHUT status, used to isolate underground fire mains while allowing visual confirmation the valve is open.'},
{id:24,cat:'GASEOUS',type:'mcq',q:'Why is CO2 clean-agent suppression restricted to unoccupied/evacuated spaces, unlike FM-200 or Novec 1230?',opts:['CO2 is more expensive','CO2 extinguishes by displacing oxygen to a level also lethal to humans; FM-200/Novec extinguish chemically at oxygen-safe concentrations','CO2 is corrosive to equipment','CO2 takes too long to discharge'],a:1,e:'CO2 reduces oxygen concentration below combustion-supporting levels — also below what a person can safely breathe. FM-200 and Novec 1230 interrupt the chemical combustion reaction at concentrations considered safe for brief human exposure.'},
{id:25,cat:'GASEOUS',type:'code',standard:'NFPA 2001',f:'What does NFPA 2001 govern?',b:'The Standard on Clean Agent Fire Extinguishing Systems — governs design, installation, and safety requirements for gaseous clean-agent suppression systems like FM-200, Novec 1230, and inert gas systems.'},
{id:26,cat:'GASEOUS',type:'flash',f:'Why do gaseous suppression systems typically use cross-zone detection before releasing agent?',b:'Requiring two independent detectors (in different zones/circuits) to both activate before discharge greatly reduces the risk of a false alarm triggering an expensive, disruptive, and unnecessary gas discharge.'},
{id:27,cat:'CODES',type:'code',standard:'NFPA 101',f:'What does NFPA 101 (Life Safety Code) govern, and why does it matter to fire protection design?',b:'It governs means of egress, occupant safety, and building construction/protection features. Fire protection systems must be coordinated with its egress requirements — suppression and detection alone aren\'t sufficient without safe evacuation routes.'},
{id:28,cat:'CODES',type:'mcq',q:'Why must fire protection design be coordinated with architectural means-of-escape planning, not designed in isolation?',opts:['It isn\'t necessary if sprinklers are installed','Detection and suppression buy time, but occupants still need clear, adequately sized, protected escape routes to actually get out safely','Only mechanical systems matter for life safety','Egress design is entirely a structural engineering concern'],a:1,e:'Suppression and detection reduce fire growth and alert occupants, but life safety ultimately depends on occupants reaching safety — meaning travel distances, exit widths, stair pressurization, and signage must all be coordinated with the fire protection strategy.'},
{id:29,cat:'CODES',type:'flash',f:'Why do most jurisdictions require civil defense/fire authority design approval before construction?',b:'To independently verify the fire protection and life-safety design meets minimum code requirements before life-safety systems are relied upon — typically involving submission of hydraulic calculations, layouts, and system schedules for review.'},
{id:30,cat:'CODES',type:'mcq',q:'What does an alarm check valve do in a wet pipe sprinkler system?',opts:['Stops all water flow permanently','Allows water to flow to sprinklers while triggering a water-flow alarm, and prevents backflow into the supply','Only tests pressure once a year','Regulates sprinkler head temperature rating'],a:1,e:'The alarm check valve is a one-way valve with a trim assembly that diverts a small flow to a water motor gong / pressure switch when a sprinkler activates and water flows — generating the alarm signal.'},
{id:31,cat:'CODES',type:'flash',f:'What does the inspector\'s test valve on a sprinkler system verify?',b:'Opening it releases water equivalent to one sprinkler head orifice, confirming the alarm check valve, waterflow switch, and alarm signal chain work correctly — a standard periodic test.'},
  ]

    content: [
{id:1,cat:'SUPPLY',type:'mcq',q:'What is a pressure reducing valve (PRV) used for in a domestic water supply riser?',opts:['To increase pump speed','To reduce and stabilize downstream pressure to a safe level for fixtures and pipework, especially at lower floors of tall buildings','To filter sediment','To mix hot and cold water'],a:1,e:'Static pressure increases with building height from the source/tank. A PRV reduces this to within fixture-rated limits (commonly ~3.5 bar max at outlets), preventing pipe/fitting damage, noise, and excessive fixture wear.'},
{id:2,cat:'SUPPLY',type:'flash',f:'What is a water hammer arrestor and why is it needed?',b:'A device (often an air cushion/piston chamber) installed near quick-closing valves (solenoid valves, washing machines) that absorbs the pressure surge created when flow is suddenly stopped, protecting pipework and joints from shock damage and noise.'},
{id:3,cat:'SUPPLY',type:'mcq',q:'Why do large buildings/resorts use hot water recirculation loops?',opts:['To save water only','To ensure hot water is available quickly at fixtures without waiting/wasting water, by continuously circulating hot water back to the heater','To pre-cool water','To increase pipe pressure'],a:1,e:'Without recirculation, hot water sits in long branch pipes and cools between uses. A recirculation loop keeps water near set temperature at the fixture takeoff point at all times, avoiding the wait-and-waste cycle.'},
{id:4,cat:'SUPPLY',type:'code',standard:'IPC / UPC',f:'What do the International Plumbing Code (IPC) and Uniform Plumbing Code (UPC) govern?',b:'Both are widely referenced US model plumbing codes governing water supply sizing, drainage, venting, and fixture requirements — via the Fixture Unit method for water supply and drainage. Many jurisdictions adapt one as their base code.'},
{id:5,cat:'SUPPLY',type:'flash',f:'Air gap vs mechanical backflow preventer — which is the more reliable method of preventing potable water contamination?',b:'An air gap (a physical, visible vertical separation between the outlet and the flood level of a fixture) is the most reliable — no moving parts to fail. Mechanical devices (RPZ, check valves) work well but can fail and need periodic testing.'},
{id:6,cat:'SUPPLY',type:'lesson',ti:'Fixture unit method for water supply sizing',bd:'Rather than simply summing every fixture\'s peak flow, the Fixture Unit (or Hunter\'s Curve) method assigns each fixture type a weighted "fixture unit" value reflecting its typical demand and use frequency, then converts the cumulative fixture units to an actual probable peak demand using an empirical curve — because not all fixtures run simultaneously.',q:'Why isn\'t domestic water supply piping simply sized by adding up every fixture\'s maximum flow rate?',opts:['Because that method is actually used, nothing else is needed','Because not all fixtures operate simultaneously — the fixture unit / Hunter\'s Curve method estimates realistic probable peak demand instead of an unrealistic worst case','Because fixture flow rates are always identical','Because pipe sizing has nothing to do with fixture demand'],a:1,e:'Simple summation would grossly oversize pipework since it assumes every fixture runs at once. The probability-based fixture unit method reflects realistic diversity of use, giving practical, economical pipe sizes.'},
{id:7,cat:'SEWER',type:'mcq',q:'Why does a drainage system need venting (vent stacks/pipes)?',opts:['To reduce pipe cost','To equalize pressure so trap seals aren\'t siphoned or blown, and to release sewer gases safely','To increase water pressure','Venting is optional in all codes'],a:1,e:'Without venting, discharging fixtures create pressure fluctuations that can siphon or push out the water seal in P-traps, letting foul sewer gas into occupied spaces. Vents allow air to enter/escape, keeping flow smooth.'},
{id:8,cat:'SEWER',type:'code',standard:'BS EN 12056',f:'What does BS EN 12056 govern?',b:'The European standard for gravity drainage systems inside buildings — covering sanitary pipework, stormwater drainage inside buildings, and wastewater lifting plants, commonly referenced on international projects.'},
{id:9,cat:'SEWER',type:'flash',f:'Why does invert level matter in gravity drainage design?',b:'The invert (inside bottom of pipe) level determines the achievable gradient/fall for gravity flow between manholes and fixtures — engineers calculate invert levels to maintain self-cleansing velocity while avoiding excessive depth or clashes with other services.'},
{id:10,cat:'SEWER',type:'mcq',q:'Why does gravity sewer design specify a minimum self-cleansing velocity?',opts:['To reduce pipe cost','To prevent solids from settling and accumulating in the pipe, which would cause blockages over time','To increase noise for leak detection','Minimum velocity has no real purpose'],a:1,e:'Below a minimum velocity (typically ~0.6-0.75 m/s depending on code), suspended solids settle out and accumulate, leading to blockages. Manning\'s Equation is commonly used to check achievable velocity at a given slope and flow.'},
{id:11,cat:'SEWER',type:'flash',f:'What is a floor drain trap primer for?',b:'It periodically (or via small continuous flow) adds water to infrequently-used floor drains, replenishing trap seal water that would otherwise evaporate over time — evaporated trap seals let sewer gas escape into the space.'},
{id:12,cat:'SEWER',type:'code',standard:"Manning's Equation",f:'What is Manning\'s Equation used for in drainage engineering?',b:'It relates flow rate to pipe slope, roughness, and cross-sectional geometry for open-channel/partial-flow gravity pipe conditions — the standard method for sizing gravity sewers and drains at a given fall.'},
{id:13,cat:'SEWER',type:'mcq',q:'Why is a grease interceptor installed on kitchen drainage lines?',opts:['To increase flow velocity','To trap fats, oils, and grease before they enter the sewer/STP and solidify, causing blockages','To disinfect wastewater','To measure flow rate'],a:1,e:'FOG (fats, oils, grease) cools and solidifies in pipework, causing blockages and interfering with downstream treatment. The interceptor slows flow so grease floats and separates before effluent continues to the sewer.'},
{id:14,cat:'STORM',type:'mcq',q:'Why do many resort/coastal sites require stormwater attenuation (detention) rather than direct discharge?',opts:['Attenuation is never actually required','To limit peak discharge rate to downstream systems/receiving waters, preventing flooding or erosion from a sudden surge of runoff','To purify the water chemically','To increase runoff speed'],a:1,e:'Detention tanks or ponds temporarily store stormwater and release it at a controlled rate, matching pre-development or code-mandated discharge limits so downstream drainage/receiving waters aren\'t overwhelmed during storm events.'},
{id:15,cat:'STORM',type:'flash',f:'What does the Rational Method (Q = C·i·A) calculate in stormwater design?',b:'Peak runoff flow rate, where C is a runoff coefficient (reflecting surface permeability), i is rainfall intensity for a chosen storm duration/return period, and A is catchment area — a widely used method for sizing drainage for smaller catchments.'},
{id:16,cat:'STORM',type:'code',standard:'Local drainage codes',f:'What determines the "design storm" used for stormwater sizing?',b:'Local/jurisdictional codes typically specify a design storm return period (e.g. 1-in-10 or 1-in-50 year event depending on risk/consequence), setting the rainfall intensity used to size drainage and attenuation capacity.'},
{id:17,cat:'STORM',type:'lesson',ti:'Soakaways on coastal/high-water-table sites',bd:'Soakaway or infiltration systems let stormwater percolate into the ground rather than being piped away — effective where soil permeability is good and the water table is low. On many coastal resort sites (like Zanzibar), a shallow water table and/or low-permeability soil can make soakaways unreliable or unsuitable, pushing the design toward attenuation tanks with controlled pumped or gravity discharge instead.',q:'Why might soakaways be unsuitable on a coastal resort site with a high water table?',opts:['Soakaways always work regardless of soil/water table conditions','A high water table leaves little unsaturated soil depth for infiltration, so the soakaway can\'t effectively absorb stormwater','Soakaways are illegal on all coastal sites','Soil type has no effect on soakaway performance'],a:1,e:'Infiltration relies on unsaturated soil to absorb and disperse water. A shallow water table limits or eliminates that capacity, often forcing the design toward attenuation and controlled discharge instead of on-site infiltration.'},
{id:18,cat:'IRRIG',type:'mcq',q:'What is the main water-efficiency advantage of drip irrigation over spray/sprinkler irrigation?',opts:['Drip irrigation uses more water for better coverage','Drip delivers water directly to the root zone with minimal evaporation and overspray losses, compared to broadcast spray patterns','Drip irrigation requires no controller','Sprinkler irrigation always uses less water'],a:1,e:'Because drip emitters apply water slowly and directly at the root zone, evaporation and wind drift losses are far lower than spray irrigation, which loses significant water to evaporation and overspray, especially in hot climates.'},
{id:19,cat:'IRRIG',type:'flash',f:'What does an ET-based (evapotranspiration) irrigation controller do?',b:'It adjusts watering schedules automatically based on local evapotranspiration data (weather-driven plant water loss), rather than a fixed timer — reducing overwatering and water waste when conditions don\'t require it.'},
{id:20,cat:'IRRIG',type:'mcq',q:'Why must an irrigation system have a backflow preventer at its connection to the potable water supply?',opts:['It is optional and rarely installed','To prevent contaminated irrigation water (fertilizers, soil, stagnant water) from being siphoned back into the potable water system','To increase irrigation pressure','To filter debris only'],a:1,e:'Irrigation systems are considered a cross-connection hazard — a backflow preventer (often an RPZ device) stops contaminated water from being drawn back into the potable supply during a pressure drop event.'},
{id:21,cat:'IRRIG',type:'flash',f:'What is a master valve in an irrigation system for?',b:'A normally-closed valve at the system\'s main supply point that only opens when a zone is actively irrigating, acting as a fail-safe against a stuck-open zone valve causing continuous uncontrolled flow/leak.'},
{id:22,cat:'IRRIG',type:'code',standard:'Water reuse guidance',f:'Why is treated STP effluent commonly specified for irrigation on resort landscapes?',b:'Reusing treated wastewater for irrigation reduces potable water demand and disposal load — many codes and sustainability certifications encourage or require this reuse pathway where treatment quality meets irrigation-safe standards.'},
{id:23,cat:'CODES',type:'code',standard:'ASPE Data Books',f:'What role do ASPE Data Books play in plumbing engineering?',b:'Published by the American Society of Plumbing Engineers, they serve as a widely used design reference covering sizing methods, fixture data, and best practices — especially valuable where local prescriptive code is silent or less detailed.'},
{id:24,cat:'CODES',type:'flash',f:'Gate valve vs globe valve — which is better suited for throttling flow, and why?',b:'Globe valve — its S-shaped flow path and disc/seat geometry are designed to handle the turbulence of partial flow control, giving smoother regulation and less seat erosion. Gate valves are meant for full-open/full-closed duty only.'},
{id:25,cat:'CODES',type:'mcq',q:'Why should unions or flanged joints be installed near pumps, valves, and equipment?',opts:['They are purely decorative','They allow quick disconnection of pipework for maintenance or equipment replacement without cutting pipe or disturbing the whole system','They increase pressure drop intentionally','They are required only for equipment over a certain size'],a:1,e:'Unions/flanges give serviceable break-points in the pipework, letting equipment be removed or swapped without major disruption to the rest of the installation.'},
{id:26,cat:'CODES',type:'flash',f:'What is a Y-strainer used for on a pump suction line?',b:'It catches debris/solids before they enter and damage the pump impeller or clog downstream fittings — sized to protect the pump while avoiding excessive pressure drop, with periodic cleaning required.'},
  ]

    content: [
{id:1,cat:'COOLING',type:'mcq',q:'In a VRV/VRF refrigerant riser, why is an oil trap (U-bend) installed every 3-4.5m of vertical rise?',opts:['To reduce pipe noise','To ensure compressor oil is carried back up with the refrigerant flow','To allow thermal expansion','To trap refrigerant for servicing'],a:1,e:'At low refrigerant velocities in vertical risers, oil separates and drains back down by gravity. Oil traps collect it so gas velocity can sweep it upward, protecting compressor lubrication.'},
{id:2,cat:'COOLING',type:'flash',f:'What does SHR (Sensible Heat Ratio) tell you?',b:'The proportion of total cooling load that is sensible (temperature) vs latent (moisture removal). SHR = Sensible Load / Total Load. High-humidity spaces (spas, kitchens) need lower SHR equipment.'},
{id:3,cat:'COOLING',type:'flash',f:'TXV — what does it stand for and what does it do?',b:'Thermostatic Expansion Valve. It meters refrigerant flow into the evaporator based on superheat, maintaining efficient evaporator performance across varying load conditions — more precise than a fixed orifice.'},
{id:4,cat:'COOLING',type:'mcq',q:'Why must refrigerant pipe sizing keep gas velocity within a specific range, not just "big enough"?',opts:['Only to reduce noise','Too low a velocity fails to carry oil back to the compressor; too high causes excess pressure drop and noise','To match compressor color coding','Velocity has no real design impact'],a:1,e:'Refrigerant piping is a balance: minimum velocity ensures oil entrainment back to the compressor, while a maximum limits pressure drop, noise, and pipe erosion.'},
{id:5,cat:'COOLING',type:'lesson',ti:'Cooling tower Range & Approach',bd:'Range is the temperature drop of water across the tower (inlet minus outlet). Approach is how close the tower gets the water to the ambient wet-bulb temperature (outlet water temp minus wet-bulb). A smaller approach means a more efficient, typically larger/costlier tower.',q:'A cooling tower has water entering at 35°C and leaving at 29.5°C, with ambient wet-bulb at 27°C. What is the approach?',opts:['5.5°C (the range)','2.5°C','8°C','29.5°C'],a:1,e:'Approach = leaving water temp minus wet-bulb = 29.5 minus 27 = 2.5°C. Range = 35 minus 29.5 = 5.5°C. Two different, commonly confused metrics.'},
{id:6,cat:'COOLING',type:'mcq',q:'Why is a machine room ventilation and refrigerant detection requirement triggered by refrigerant charge size (per ASHRAE 15)?',opts:['It is purely a cost-driven design choice','Large refrigerant charges pose an asphyxiation/toxicity risk if leaked in an enclosed space, so ASHRAE 15 mandates ventilation and detection above certain charge thresholds','It has nothing to do with safety','Only applies to ammonia systems'],a:1,e:'ASHRAE 15 sets machine room safety requirements — mechanical ventilation and refrigerant detectors — scaled to refrigerant type and quantity, since a leak in an enclosed plant room can create a hazardous atmosphere.'},
{id:7,cat:'AIR',type:'mcq',q:'CAV vs VAV — what is the key operational difference?',opts:['CAV varies temperature, VAV varies humidity','CAV supplies constant airflow at varying temperature; VAV varies airflow to maintain temperature','VAV only works in winter','CAV is only for exhaust systems'],a:1,e:'Constant Air Volume (CAV) systems modulate supply air temperature at a fixed flow rate. Variable Air Volume (VAV) systems keep supply air temp roughly constant and throttle volume via VAV boxes/dampers — more energy efficient for varying loads.'},
{id:8,cat:'AIR',type:'flash',f:'AHU vs FCU — what is the core difference?',b:'An AHU (Air Handling Unit) is typically a larger central unit conditioning air for multiple zones via ductwork, often with fresh air intake and filtration. An FCU (Fan Coil Unit) is a smaller zone-level unit with a coil and fan, served by a central chilled/hot water plant.'},
{id:9,cat:'AIR',type:'mcq',q:'Why does an AC condensate drain line need a P-trap?',opts:['To collect debris','To prevent negative pressure in the unit from pulling odors/air back through the drain, and to maintain drainage seal','To slow the water down','It is purely decorative'],a:1,e:'The AHU/FCU operates under slight negative pressure. Without a trap, that pressure would suck air (and odors, insects) back up the condensate line, or air lock could prevent proper drainage.'},
{id:10,cat:'AIR',type:'flash',f:'What is the difference between static pressure and velocity pressure in a duct system?',b:'Static pressure pushes air outward against duct walls (the pressure that drives flow through resistance/friction). Velocity pressure results from air motion itself. Total pressure = static + velocity — fan selection is based on total system static pressure requirement.'},
{id:11,cat:'AIR',type:'flash',f:'MERV / EN779 filter ratings — what do they indicate?',b:'They classify a filter\'s particle capture efficiency across particle size ranges — higher MERV (or finer EN779/ISO 16890 class) means finer filtration but typically higher pressure drop, affecting fan energy and filter change frequency.'},
{id:12,cat:'CONTROLS',type:'flash',f:'What is a VFD (Variable Frequency Drive) used for on an AHU fan or pump?',b:'It varies the electrical frequency supplied to the motor, changing its rotational speed, so fans/pumps match actual demand instead of running at full speed with dampers/valves throttling — saving significant energy (affinity laws: power proportional to speed cubed).'},
{id:13,cat:'CONTROLS',type:'mcq',q:'Why is a balancing valve installed on each branch of a hydronic (chilled/hot water) distribution loop?',opts:['To isolate the branch for maintenance only','To measure and set the correct flow rate to each branch so all terminals get design flow','To prevent water hammer','To filter debris'],a:1,e:'Without balancing, water takes the path of least resistance and branches closest to the pump get excess flow while distant ones are starved. Balancing valves (with flow measurement ports) let commissioning engineers set each branch to design flow.'},
{id:14,cat:'CONTROLS',type:'mcq',q:'What is the function of an expansion tank in a closed hydronic loop?',opts:['To store extra water for fire fighting','To absorb the volumetric expansion of water as it heats up, controlling system pressure','To remove air from the system','To boost pump pressure'],a:1,e:'Water expands as it heats. In a closed loop this would spike pressure dangerously without somewhere to go — the expansion tank accommodates that volume change, keeping system pressure within safe limits.'},
{id:15,cat:'CONTROLS',type:'flash',f:'What is an economizer / free cooling cycle?',b:'It uses cool outside air directly (or via a heat exchanger) to meet part or all of the cooling load when ambient conditions are favorable, reducing mechanical (compressor) cooling energy use.'},
{id:16,cat:'CONTROLS',type:'flash',f:'Chilled water pipe insulation — what is its primary purpose?',b:'Primarily to prevent condensation on the pipe surface (since pipe temp is below ambient dew point), not just to save energy. A breached vapor barrier lets moisture migrate in, causing wet insulation and corrosion under insulation (CUI) — a common site defect to check for.'},
{id:17,cat:'SMOKE',type:'flash',f:'What does staircase pressurization achieve during a fire?',b:'It maintains a positive air pressure in the escape stair relative to the fire floor, preventing smoke ingress into the protected escape route so occupants can evacuate safely.'},
{id:18,cat:'SMOKE',type:'mcq',q:'Why are fire/smoke dampers required at duct penetrations through fire-rated walls or floors?',opts:['Purely for airflow balancing, no fire function','To maintain the fire-resistance rating of the wall/floor by automatically closing off the duct penetration during a fire, preventing fire/smoke spread through the ductwork','To reduce duct noise','They are decorative access panels'],a:1,e:'A duct penetration is a breach in a fire-rated barrier. Fire/smoke dampers close automatically (via fusible link or detection signal) to restore that barrier\'s integrity, stopping fire and smoke from spreading through the duct system.'},
{id:19,cat:'SMOKE',type:'code',standard:'BS EN 12101-6 / NFPA 92',f:'What do BS EN 12101-6 and NFPA 92 govern?',b:'They govern the design of smoke control systems — including stair, lobby, and shaft pressurization — setting requirements for pressure differentials, leakage assumptions, and door-opening force limits to keep escape routes smoke-free.'},
{id:20,cat:'SMOKE',type:'flash',f:'Why does stair pressurization design include a maximum door-opening force check?',b:'Excess pressurization can make doors too hard to open manually, trapping occupants. Design must balance enough pressure to exclude smoke against a door force occupants (including less able ones) can realistically overcome.'},
{id:21,cat:'CODES',type:'code',standard:'ASHRAE 62.1',f:'What does ASHRAE 62.1 govern?',b:'Ventilation for Acceptable Indoor Air Quality — it sets minimum outdoor air ventilation rates for different space types to maintain healthy indoor air quality.'},
{id:22,cat:'CODES',type:'code',standard:'ASHRAE 90.1',f:'What does ASHRAE 90.1 govern?',b:'Energy Standard for Buildings Except Low-Rise Residential — it sets minimum energy efficiency requirements for HVAC, lighting, and building envelope systems.'},
{id:23,cat:'CODES',type:'code',standard:'ASHRAE Fundamentals',f:'What role does the ASHRAE Fundamentals Handbook play in HVAC design?',b:'It is the core technical reference for load calculation methodology, psychrometrics, heat transfer, and design data underpinning most HVAC engineering calculations and software (like HAP).'},
{id:24,cat:'CODES',type:'code',standard:'ASHRAE 15',f:'What does ASHRAE 15 govern?',b:'The Safety Standard for Refrigeration Systems — it governs refrigerant classification, machine room ventilation, detection, and safety requirements based on refrigerant type and quantity.'},
{id:25,cat:'CODES',type:'mcq',q:'What is the practical implication of the fan/pump affinity laws for VFD-driven energy savings?',opts:['Speed and power have no real relationship','Power consumption varies roughly with the cube of speed, so even a modest speed reduction gives a large energy saving','Power varies inversely with speed','Affinity laws only apply to refrigeration compressors'],a:1,e:'Because power is roughly proportional to speed cubed, reducing a fan or pump to 80% speed can cut power draw to roughly half — this is the core reason VFDs deliver such strong energy savings versus throttling with dampers/valves at full speed.'},
  ]

{id:1,cat:'STEAM',type:'mcq',q:'What is the basic purpose of a steam trap?',opts:['To generate steam','To automatically discharge condensate (and air) from the steam system while preventing live steam from escaping','To increase steam pressure','To measure steam flow rate'],a:1,e:'Steam traps sense the difference between condensate and live steam (via temperature, density, or thermodynamic effect) and open to release condensate/air while keeping steam in the system where it does useful work.'},
{id:2,cat:'STEAM',type:'flash',f:'How does a thermodynamic (disc) steam trap operate?',b:'It uses the velocity/pressure difference between flash steam and condensate across a flat disc — condensate flow lifts the disc to discharge, while high-velocity flash steam creates a pressure effect above the disc that snaps it shut, retaining live steam.'},
{id:3,cat:'STEAM',type:'mcq',q:'Why must steam piping be pitched (sloped) in the direction of flow?',opts:['For aesthetic reasons only','To allow condensate to drain by gravity toward low points/traps rather than pooling in the pipe and being carried along with the steam','It has no functional purpose','To reduce pipe material cost'],a:1,e:'Steam naturally condenses as it loses heat along a pipe run. Without proper pitch to drain points, condensate accumulates in the pipe, and fast-moving steam can pick it up as slugs, causing water hammer.'},
{id:4,cat:'STEAM',type:'flash',f:'What is "flash steam" and where does it come from?',b:'When high-pressure condensate is released to a lower pressure (e.g. through a steam trap), some of it instantly re-vaporizes because its temperature is above the boiling point at the new lower pressure — this re-vaporized fraction is flash steam, which can be recovered and reused rather than wasted.'},
{id:5,cat:'STEAM',type:'code',standard:'ASME B31.1',f:'What does ASME B31.1 (Power Piping) govern?',b:'It governs the design, materials, fabrication, and inspection of power piping systems, including steam and high-pressure/high-temperature piping typically found in central plant and boiler distribution systems.'},
{id:6,cat:'STEAM',type:'mcq',q:'What is a pressure reducing station (PRS) used for in a steam distribution system?',opts:['To increase steam pressure for far-away users','To reduce high-pressure boiler-generated steam down to the lower pressure required by specific end-use equipment, in a controlled and safe manner','To remove moisture from steam only','To generate electricity from steam'],a:1,e:'Steam is often generated and distributed at a higher pressure for efficiency, then reduced at PRS stations (with safety relief protection) to the specific lower pressure needed by kitchen equipment, laundry, or heat exchangers.'},
{id:7,cat:'STEAM',type:'flash',f:'Why is water hammer in steam systems considered especially dangerous?',b:'A slug of condensate carried along by high-velocity steam can strike a pipe fitting or valve with tremendous force due to the density difference and steam\'s high energy content — capable of rupturing pipework or damaging equipment, more violently than typical water-system hammer.'},
{id:8,cat:'STEAM',type:'lesson',ti:'Steam quality and dryness fraction',bd:'Steam quality (dryness fraction) describes what proportion of the steam is actually vapor versus entrained water droplets. "Wet" steam carrying moisture reduces heat transfer efficiency at the point of use and increases the risk of water hammer and erosion in piping and control valves — proper drainage, trap placement, and separator use help maintain high steam quality.',q:'Why does low steam quality (wet steam) matter for a heat exchanger or process application?',opts:['It has no real effect on performance','Entrained water droplets reduce effective heat transfer and increase water hammer/erosion risk, reducing efficiency and equipment life','Wet steam always improves heat transfer','Steam quality only matters for boiler design, not distribution'],a:1,e:'The energy content usefully delivered by steam comes largely from its latent heat as vapor condenses; entrained water doesn\'t carry the same useful energy and instead adds erosion/water hammer risk, so maintaining high dryness fraction matters throughout distribution.'},
{id:9,cat:'STEAM',type:'code',standard:'ASME BPVC',f:'What does the ASME Boiler and Pressure Vessel Code (BPVC) govern?',b:'It governs the design, fabrication, inspection, and safety of boilers and pressure vessels — a foundational code referenced for boiler plant design, construction, and certification.'},
{id:10,cat:'STEAM',type:'mcq',q:'Why is steam condensate typically returned to the boiler feed system rather than discharged to drain?',opts:['Condensate return has no real benefit','It recovers heat energy, saves treated water, and reduces make-up water chemical treatment costs — all improving overall system efficiency','Condensate is hazardous and must never be reused','It reduces boiler pressure requirements'],a:1,e:'Returned condensate is already hot, pre-treated water, so reusing it as boiler feed significantly cuts fuel energy needed to reheat fresh make-up water and reduces water treatment chemical consumption.'},
{id:11,cat:'STEAM',type:'flash',f:'Why is a pressure relief/safety valve mandatory on a steam boiler?',b:'It is a critical safety device that automatically vents excess pressure if the boiler exceeds its safe working pressure, preventing a potentially catastrophic overpressure failure/explosion — a non-negotiable code requirement.'},
{id:12,cat:'STEAM',type:'flash',f:'What is a steam header (manifold) used for?',b:'A central distribution point where steam from the boiler(s) is collected and then split off to multiple downstream users/branches at a controlled common pressure, simplifying distribution and isolation.'},
{id:13,cat:'STEAM',type:'mcq',q:'Why must steam traps be correctly sized rather than just "large enough"?',opts:['Trap sizing has no real consequence','An undersized trap causes condensate backup and water hammer risk; an oversized trap wastes live steam by blowing it through before it fully condenses','Oversized traps are always more efficient','Steam traps do not need sizing calculations'],a:1,e:'Trap capacity must match the actual condensate load at the operating pressure differential — too small backs up condensate into the process/pipe, too large risks passing live steam through, wasting energy.'},
{id:14,cat:'COMPAIR',type:'mcq',q:'What is the purpose of an air receiver tank in a compressed air system?',opts:['To generate compressed air','To buffer supply and demand fluctuations, reduce compressor cycling, and allow moisture/condensate to settle out','To filter oil only','To reduce electrical demand of the compressor motor'],a:1,e:'The receiver smooths out short-term demand spikes so the compressor doesn\'t cycle excessively, improves system stability, and gives condensate time to drop out before the air travels further downstream.'},
{id:15,cat:'COMPAIR',type:'flash',f:'What does "dew point" mean in the context of compressed air drying?',b:'The temperature at which moisture in the compressed air begins to condense. A lower (more negative) dew point means drier air — critical for instrument air, pneumatic tools, and any application sensitive to moisture or freezing in lines.'},
{id:16,cat:'COMPAIR',type:'mcq',q:'Refrigerated vs desiccant compressed air dryers — what is the key difference?',opts:['They perform identically in all applications','Refrigerated dryers achieve moderate dew points (~+3°C) suitable for general use; desiccant dryers achieve much lower dew points (down to -40°C or lower), needed for critical or outdoor/freezing-exposed applications','Desiccant dryers use no consumables','Refrigerated dryers are only used for oil removal'],a:1,e:'Refrigerated dryers cool air to condense out moisture and are adequate for most general plant use. Desiccant dryers use a moisture-absorbing media to reach much lower dew points, essential where lines are exposed to freezing or for critical instrument air.'},
{id:17,cat:'COMPAIR',type:'flash',f:'Why should compressed air piping be sloped and fitted with drain points?',b:'Even after drying, some moisture condenses in distribution piping as air cools further downstream. Sloped piping with low-point drains removes this condensate before it reaches tools/instruments, preventing corrosion and moisture-related faults.'},
{id:18,cat:'COMPAIR',type:'lesson',ti:'Oil-free vs oil-lubricated compressors',bd:'Oil-lubricated compressors are generally more cost-effective and durable for general industrial/utility compressed air use, with oil carryover managed by downstream filtration. Oil-free compressors eliminate the lubricant from the compression chamber entirely, avoiding any risk of oil contamination — required for food and beverage processing, pharmaceutical, and other critical applications where trace oil carryover is unacceptable.',q:'Why would a resort\'s kitchen or spa/pharma-grade application specifically require an oil-free compressor?',opts:['Oil-free compressors are always cheaper, that\'s the only reason','Any risk of oil carryover into the air stream is unacceptable for food-contact or critical/clean applications, so eliminating oil from the compression chamber removes that risk entirely','Oil-lubricated compressors cannot reach high enough pressure','Oil-free compressors require no maintenance at all'],a:1,e:'Even well-filtered oil-lubricated air carries some risk of trace oil carryover. For food-contact or critical clean-air applications, that risk is unacceptable, so an oil-free compressor design is specified despite typically higher capital cost.'},
{id:19,cat:'COMPAIR',type:'flash',f:'What is the purpose of an intercooler in a multi-stage air compressor?',b:'It cools compressed air between compression stages, reducing its temperature (and volume) before the next stage — improving overall compression efficiency and reducing the thermal/mechanical stress on later stages.'},
{id:20,cat:'COMPAIR',type:'code',standard:'ISO 8573-1',f:'What does ISO 8573-1 classify?',b:'It is the international standard classifying compressed air purity — defining classes for particle content, water content (including dew point), and oil content, used to specify air quality requirements for different applications.'},
{id:21,cat:'CODES',type:'code',standard:'ASME B31.3',f:'What does ASME B31.3 (Process Piping) cover, and how does it relate to compressed air/process steam?',b:'It governs process piping design across industries, and can apply to compressed air or process steam piping depending on the specific application and scope, complementing or overlapping with B31.1 for power piping.'},
{id:22,cat:'CODES',type:'code',standard:'NFPA 85 / 86',f:'What do NFPA 85 and 86 govern?',b:'They cover combustion and boiler/furnace safety systems — governing safety interlocks, purge sequences, and protective systems for larger boiler and combustion installations to prevent explosion hazards.'},
{id:23,cat:'CODES',type:'mcq',q:'Why do steam boiler rooms typically require dedicated combustion air supply and explosion relief provisions?',opts:['These are optional design enhancements only','Combustion requires adequate air supply for safe, complete burning, and explosion relief provisions limit damage/injury risk in the rare event of a combustion-related overpressure incident','Boiler rooms never need special ventilation','Explosion relief is only relevant for gas turbines'],a:1,e:'Combustion air ensures safe, efficient burning (avoiding incomplete combustion hazards), while explosion relief panels/venting are a safety design feature limiting the consequences of an abnormal combustion event in the confined boiler room.'},
{id:24,cat:'CODES',type:'flash',f:'What is a compressed air receiver drain valve for?',b:'It removes accumulated condensate from the bottom of the receiver tank, either manually or via an automatic (float or timed) drain valve, preventing moisture buildup from being carried into the distribution system.'},
  ]

    content: [
{id:1,cat:'STP',type:'lesson',ti:'STP basic treatment stages',bd:'A typical resort STP follows: (1) Screening/preliminary treatment removing solids/grit, (2) Primary treatment (settling), (3) Secondary biological treatment (activated sludge/MBBR/MBR — microorganisms breaking down organic matter), (4) Tertiary treatment (filtration/disinfection, often UV or chlorination) before discharge or reuse (e.g. irrigation).',q:'Which stage of STP treatment primarily uses microorganisms to break down dissolved organic matter?',opts:['Screening','Primary settling','Secondary biological treatment','Chlorination'],a:2,e:'Secondary treatment is biological — aerobic microorganisms consume organic pollutants, converting them into biomass (sludge) and gases, significantly reducing BOD/COD before tertiary polishing.'},
{id:2,cat:'STP',type:'flash',f:'What does BOD (Biochemical Oxygen Demand) measure, and why does STP design target reducing it?',b:'BOD measures the oxygen consumed by microorganisms breaking down organic matter in water — a proxy for organic pollution load. Reducing BOD is a core STP design goal since high-BOD discharge depletes oxygen in receiving waters, harming aquatic life.'},
{id:3,cat:'STP',type:'mcq',q:'MBR (Membrane Bioreactor) vs conventional activated sludge — what is the main advantage of MBR?',opts:['MBR requires no aeration at all','MBR combines biological treatment with membrane filtration, achieving very high effluent quality in a smaller footprint than conventional clarifiers','MBR is always cheaper to install','MBR eliminates the need for any secondary treatment'],a:1,e:'By replacing gravity clarifiers with membranes, MBR achieves a much higher quality, essentially solids-free effluent, and can operate at higher biomass concentrations — reducing footprint, which is valuable on constrained resort sites.'},
{id:4,cat:'STP',type:'flash',f:'What is sludge digestion/dewatering for in an STP?',b:'It stabilizes and reduces the volume of biological sludge produced during treatment (via anaerobic/aerobic digestion and mechanical dewatering), making it more manageable and less costly to dispose of or reuse.'},
{id:5,cat:'STP',type:'mcq',q:'Why is treated STP effluent commonly reused for irrigation on resort sites rather than simply discharged?',opts:['Reuse is never permitted by any code','It reduces potable water demand for landscaping and disposal/discharge burden, and is often incentivized or required by sustainability regulations','Treated effluent cannot be used for any purpose','Irrigation reuse increases operating costs with no benefit'],a:1,e:'Reusing treated effluent for irrigation conserves potable water, reduces reliance on discharge infrastructure, and is frequently encouraged (or mandated) by environmental and sustainability requirements for resort developments.'},
{id:6,cat:'STP',type:'flash',f:'What does "hydraulic retention time" (HRT) mean in an STP process tank?',b:'The average time wastewater spends in a given treatment tank/basin (Volume ÷ Flow rate) — a key design parameter ensuring biological processes have enough contact time to achieve the required treatment level.'},
{id:7,cat:'STP',type:'code',standard:'WHO / local effluent standards',f:'What do effluent discharge/reuse standards typically regulate for treated wastewater?',b:'They set allowable limits for parameters like BOD, TSS (total suspended solids), and pathogen indicators depending on the discharge destination (sea outfall, surface water) or reuse purpose (irrigation), protecting public health and the environment.'},
{id:8,cat:'STP',type:'mcq',q:'Why do STP designs typically include both aerobic and (in some processes) anaerobic treatment stages?',opts:['They serve identical purposes and either works alone','Aerobic processes efficiently break down organic matter with oxygen present; anaerobic processes (e.g. in sludge digestion) further stabilize sludge and can generate biogas, without requiring aeration energy','Anaerobic treatment is only used for drinking water','Aerobic treatment is never used in STPs'],a:1,e:'Aerobic biological treatment (activated sludge, MBBR, MBR) handles the main organic load efficiently. Anaerobic digestion of the resulting sludge further reduces volume/pathogens and can recover biogas energy, without the energy cost of aeration.'},
{id:9,cat:'SWRO',type:'mcq',q:'What is the purpose of an RO (Reverse Osmosis) membrane?',opts:['To add minerals to water','To remove dissolved salts and impurities by forcing water through a semi-permeable membrane under high pressure, rejecting dissolved solids','To heat water for disinfection','To measure water flow rate'],a:1,e:'RO membranes allow water molecules through while rejecting dissolved salts and most contaminants, driven by pressure exceeding the feed water\'s osmotic pressure — the core desalination/purification mechanism.'},
{id:10,cat:'SWRO',type:'flash',f:'Why is pre-treatment (media/cartridge filtration) needed before an RO membrane?',b:'RO membranes are highly susceptible to fouling and damage from suspended solids, organics, and scale-forming ions. Pre-treatment removes these before the feed water reaches the membrane, protecting it and extending membrane life.'},
{id:11,cat:'SWRO',type:'mcq',q:'Why does seawater RO require much higher operating pressure than brackish water RO?',opts:['Seawater is simply pumped further, requiring more pressure to travel','Seawater has much higher salinity/osmotic pressure that must be overcome to drive water through the membrane against the concentration gradient','Seawater RO membranes are physically thicker for no functional reason','Pressure requirements are identical regardless of salinity'],a:1,e:'Osmotic pressure increases with salinity. Seawater\'s high dissolved salt content means a much higher applied pressure (typically 55-80+ bar) is needed to overcome osmotic pressure and drive permeate through the membrane, versus brackish water RO (much lower pressure).'},
{id:12,cat:'SWRO',type:'flash',f:'What does a pressure/energy exchanger device do in an SWRO plant?',b:'It recovers energy from the high-pressure reject brine stream leaving the membranes and transfers it to incoming feed water, dramatically cutting the pump energy needed — one of the most significant energy efficiency measures in modern SWRO design.'},
{id:13,cat:'SWRO',type:'code',standard:'Coastal/environmental discharge regulations',f:'What do brine discharge regulations typically require for SWRO plants?',b:'Since concentrated reject brine can locally raise salinity and harm marine ecosystems near the outfall, regulations often require diffusion/dilution design (e.g. multi-port diffusers) to disperse brine and limit environmental impact.'},
{id:14,cat:'SWRO',type:'mcq',q:'Why is membrane fouling/scaling a major operational concern in RO systems, and what does antiscalant dosing address?',opts:['Fouling has no real impact on RO performance','Fouling/scaling reduces membrane flux and increases pressure drop over time; antiscalant chemicals inhibit precipitation of scale-forming salts (like calcium carbonate) on the membrane surface','Antiscalant dosing replaces the need for any pre-treatment','Fouling only affects brackish water RO, not seawater RO'],a:1,e:'As water is concentrated through the membrane stages, dissolved salts can exceed their solubility limit and precipitate onto the membrane, reducing performance. Antiscalants keep these salts in solution longer, protecting membrane performance and extending cleaning intervals.'},
{id:15,cat:'SWRO',type:'lesson',ti:'Recovery rate in RO systems',bd:'Recovery rate is the percentage of feed water converted into usable permeate (the rest becomes concentrated reject/brine). Seawater RO typically operates at a lower recovery rate (roughly 40-50%) than brackish water RO (which can reach 75-85%+), because seawater\'s higher salinity increases fouling/scaling risk at higher concentration factors.',q:'Why does seawater RO typically operate at a lower recovery rate than brackish water RO?',opts:['Seawater RO membranes are less efficient by design, unrelated to salinity','Higher feed salinity means the reject stream becomes concentrated to problematic (fouling/scaling) levels sooner, limiting how much permeate can be recovered before that becomes an issue','Recovery rate has no relationship to salinity','Brackish water always has a lower recovery rate than seawater'],a:1,e:'As more permeate is extracted, the remaining reject stream becomes increasingly concentrated. Seawater\'s already-high starting salinity means that concentration factor hits problematic fouling/scaling levels at a lower recovery percentage than for lower-salinity brackish water.'},
{id:16,cat:'SWRO',type:'flash',f:'What does SDI (Silt Density Index) measure in feedwater, and why does it matter?',b:'SDI measures a feedwater\'s fouling potential (how quickly it clogs a test filter) — a low SDI indicates feedwater is well pre-treated and less likely to foul the downstream RO membranes quickly.'},
{id:17,cat:'CODES',type:'flash',f:'Why is UV disinfection often applied after RO or STP treatment before reuse or potable use?',b:'UV provides an additional disinfection barrier against pathogens (including some chlorine-resistant organisms) without adding chemical residual, commonly used as a final polishing step before water is reused or distributed.'},
{id:18,cat:'CODES',type:'mcq',q:'Why is chlorination sometimes still applied after UV treatment in a water system?',opts:['UV always eliminates the need for any further disinfection','UV disinfects at the point of treatment but leaves no residual protection; chlorine provides a persistent residual disinfectant protecting water through storage and distribution','Chlorination is required only for legal/paperwork reasons','UV and chlorine perform identical functions redundantly'],a:1,e:'UV inactivates pathogens instantly as water passes through the UV chamber but doesn\'t protect water further downstream. A small chlorine residual guards against recontamination during storage and distribution — the two methods are often complementary.'},
{id:19,cat:'CODES',type:'code',standard:'WHO Guidelines',f:'What role do WHO drinking water guidelines play for treated/desalinated water?',b:'They provide internationally recognized benchmark parameters (including TDS and other water quality limits) that many national/local potable water standards reference or adapt for treated and desalinated water end use.'},
{id:20,cat:'CODES',type:'flash',f:'What TDS (Total Dissolved Solids) level is typically targeted for SWRO product (potable) water?',b:'Commonly below roughly 500 mg/L TDS for potable use (often blended or further polished to reach target taste/mineral levels), though exact targets depend on local regulatory and taste/quality standards.'},
  ]
