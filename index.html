    content: [
{id:1,cat:'POOL',type:'mcq',q:'In infinity pool design, what is the Francis Weir Formula used to calculate?',opts:['Pump total dynamic head','The flow rate of water spilling over the weir edge, based on weir length and head of water over it','Chemical dosing rate','Pipe insulation thickness'],a:1,e:'The Francis Weir Formula (Q = 1.84 x L x H^1.5, SI form, with weir coefficient adjustments) relates flow rate over a weir to its effective length and the head of water over the crest — used to size infinity edge flow and downstream catch basin/balancing tank capacity.'},
{id:2,cat:'POOL',type:'flash',f:'What is the role of a balancing tank in an infinity edge pool system?',b:'It collects water that continuously spills over the infinity edge into the catch basin, providing a reservoir the circulation pump draws from — buffering volume changes from bather displacement and evaporation so the visual effect and pump supply stay stable.'},
{id:3,cat:'POOL',type:'mcq',q:'What does "turnover rate" mean in swimming pool circulation design?',opts:['How often the pool water is fully replaced with fresh water','The time taken for the circulation system to filter/treat a volume of water equal to the total pool volume once','The rotational speed of the pump impeller','How often chemicals are dosed'],a:1,e:'Turnover rate/period is the time for the full pool volume to pass through filtration and treatment once (commercial pools often target 4-6 hours). It drives required circulation flow rate: Flow = Pool Volume / Turnover Period.'},
{id:4,cat:'POOL',type:'flash',f:'What is the purpose of a hair and lint strainer before a pool circulation pump?',b:'It catches hair, leaves, and debris before they reach the pump impeller, preventing clogging, impeller damage, and loss of circulation efficiency — positioned upstream of the pump, easily accessible for regular cleaning.'},
{id:5,cat:'POOL',type:'mcq',q:'Why might UV disinfection be used alongside (not instead of) chlorine in a swimming pool?',opts:['UV replaces the need for any filtration','UV inactivates chlorine-resistant pathogens (like Cryptosporidium) and reduces chloramine formation, while chlorine still provides a residual disinfectant in the water','UV is only used for aesthetic clarity','UV eliminates the need for circulation pumps'],a:1,e:'Chlorine alone struggles against certain resistant organisms and produces combined chlorine (chloramines) with organic load from bathers. UV provides an additional disinfection barrier and helps break down chloramines, while chlorine maintains a protective residual — commonly paired, not substituted.'},
{id:6,cat:'POOL',type:'flash',f:'Why is chemical dosing (chlorine/pH) typically injected after the filter, not before?',b:'Dosing after filtration ensures the disinfectant/pH-adjusting chemical isn\'t partially consumed or filtered out before reaching the pool, and avoids potential chemical reactions with debris/organics fouling the filter media.'},
{id:7,cat:'POOL',type:'mcq',q:'Why do commercial/public pools require adequate surface skimming (skimmers or perimeter overflow gutter)?',opts:['Purely for aesthetic water movement','To continuously remove floating oils, debris, and surface contaminants from bather load before they concentrate or sink, keeping the water surface clean and safe','Surface skimming has no water quality function','Only decorative pools need surface skimming'],a:1,e:'Bather-introduced oils and floating debris concentrate at the surface. Skimmers or perimeter gutters continuously draw off this surface layer to the filtration system, which is a core water quality function in public pool design.'},
{id:8,cat:'POOL',type:'flash',f:'Why are plunge pool chillers typically sized differently from standard pool heaters?',b:'A plunge pool chiller must reject significant heat to reach and maintain a cold target temperature against ambient heat gain, requiring refrigeration-based cooling capacity sizing rather than the heating capacity sizing used for standard heated pools/spas.'},
{id:9,cat:'FEATURES',type:'mcq',q:'Why do decorative fountains/water features often need separate filtration/treatment from a main swimming pool system?',opts:['They never need any treatment','Different water volumes, exposure conditions (open to debris/wildlife), and aesthetic clarity requirements often call for a dedicated, appropriately sized circulation and treatment system','Fountains are always connected directly to the main pool filtration','Water features have no water quality concerns'],a:1,e:'Fountains and features often have different volumes, higher exposure to airborne debris and evaporation, and specific clarity/aesthetic demands — making a dedicated, correctly sized treatment system more practical than sharing an unrelated pool system.'},
{id:10,cat:'FEATURES',type:'flash',f:'What is a "dry deck" water feature or splash pad, and how does its water handling differ from a standing pool?',b:'Water sprays or jets from deck-level nozzles with no standing body of water — water drains immediately to a buffer/collection tank, is treated, and recirculated, rather than being stored as a standing pool. This reduces standing-water safety/hygiene concerns, especially relevant for children\'s play areas.'},
{id:11,cat:'FEATURES',type:'mcq',q:'What is the purpose of a surge tank in a fountain or water feature system?',opts:['To generate the fountain jets directly','To accommodate the temporary rise and fall in water level caused by jets, sprays, or wave action without overflowing or starving the pump','To disinfect the water','To heat the water'],a:1,e:'Dynamic water features cause the visible water level to fluctuate as water is thrown into the air or displaced by wave action. A surge tank buffers this fluctuation, protecting the pump from running dry and preventing uncontrolled overflow.'},
{id:12,cat:'FEATURES',type:'flash',f:'Why is a check valve/backflow preventer important where a water feature draws from or discharges near a potable supply?',b:'It prevents contaminated feature water (with treatment chemicals, debris, or stagnant water) from being siphoned back into the potable water system during a pressure drop — the same cross-connection control principle used for irrigation systems.'},
{id:13,cat:'WATERPARK',type:'mcq',q:'Why do water slides require a specific "flume" flow rate design?',opts:['Flow rate is arbitrary and not really specified','A continuous water film is needed along the slide surface for rider lubrication and safety, sized per the manufacturer\'s specified minimum flow rate for that flume','Slides do not use flowing water at all','Higher flow always means a faster, more exciting ride with no safety implication'],a:1,e:'Insufficient water film increases friction and rider injury risk (skin abrasion, unpredictable speed); manufacturers specify minimum flow rates per flume that must be met by the pump/circulation design.'},
{id:14,cat:'WATERPARK',type:'flash',f:'What is a "run-out lane/pool" at the base of a water slide designed for?',b:'A dedicated deceleration zone (a shallow lane or splash pool) that safely dissipates the rider\'s speed before they reach the main pool or exit point, preventing collisions and injury from riders exiting the slide at speed.'},
{id:15,cat:'WATERPARK',type:'mcq',q:'Why do water parks typically need higher turnover rates and stronger disinfection residuals than standard swimming pools?',opts:['Water parks are exempt from disinfection requirements','Much higher bather density/load per unit area introduces contaminants faster, requiring more aggressive treatment to maintain safe water quality','Water park pools use a fundamentally different disinfectant type entirely','Turnover rate has no relationship to bather load'],a:1,e:'High-throughput water park attractions see far more bathers per unit pool volume than a standard pool, introducing organic/chemical contamination faster — driving the need for higher circulation turnover and stronger residual disinfection to keep pace.'},
{id:16,cat:'WATERPARK',type:'flash',f:'What is a wave pool surge/compensation tank used for?',b:'It accommodates the very large, rapid water displacement caused by wave generation — without it, wave action would cause uncontrolled overflow or expose the pump to run-dry conditions at the trough of each wave cycle.'},
{id:17,cat:'WATERPARK',type:'code',standard:'ASTM F2376 (and similar)',f:'What do water slide/attraction safety design standards like ASTM F2376 govern?',b:'They set safety design requirements for water slides and similar attractions — covering flume geometry, flow rate, run-out design, and structural/operational safety criteria that manufacturers and designers must meet.'},
{id:18,cat:'CODES',type:'code',standard:'ANSI/APSP/ICC',f:'What does the ANSI/APSP/ICC standard family govern for public pools?',b:'It is a widely referenced American National Standard for public swimming pools, covering circulation system design, filtration, safety barriers, and other requirements for commercial/public pool installations.'},

const DISC_ORDER = ["fire", "plumb", "acmv", "steam", "wtreat", "pool"];
function CD(){ return DISCIPLINES[STATE.discipline]; }

const ITEMS_PER_DAY = 3;
const DEEP_DIVE_BATCH_SIZE = 4;
const EPOCH = new Date('2025-01-01T00:00:00Z').getTime();

/* ================= STATE / STORAGE ================= */
let STATE = {
  screen: 'launcher', // 'launcher' | 'app'
  discipline: null, // current discipline key when screen==='app'
  progress: null, // {answered:{id:{result,count}}, streak:{current,longest,lastDate}, history:{date:{done,score,total}}}
  view: 'today',
  sessionQueue: [],
  sessionIdx: 0,
  sessionAnswers: [], // {id, correct}
  exploreCat: null,
  deepDiveCache: {}, // per-discipline: null=not started, 'loading', 'timeout', 'error', or an array of freshly generated items for today
};
function getDeepDive(){ return STATE.deepDiveCache[STATE.discipline]; }
function setDeepDive(v){ STATE.deepDiveCache[STATE.discipline] = v; }
function storageKey(name){ return CD().prefix + '-' + name; }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function dayNumber(){ return Math.floor((Date.now() - EPOCH) / 86400000); }

function seededShuffle(arr, seed){
  const a = arr.slice();
  let s = seed;
  for(let i=a.length-1;i>0;i--){
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s/233280)*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
const SHUFFLED_DECK_CACHE = {};
function getShuffledDeck(){
  const key = STATE.discipline;
  if(!SHUFFLED_DECK_CACHE[key]) SHUFFLED_DECK_CACHE[key] = seededShuffle(CD().content, 42);
  return SHUFFLED_DECK_CACHE[key];
}

async function loadProgress(){
  try{
    const res = await window.storage.get(storageKey('progress-v1'));
    STATE.progress = res ? JSON.parse(res.value) : defaultProgress();
  }catch(e){
    STATE.progress = defaultProgress();
  }
}
function defaultProgress(){
  return { answered:{}, streak:{current:0, longest:0, lastDate:null}, history:{}, totalAnswered:0, totalCorrect:0 };
}
async function saveProgress(){
  try{ await window.storage.set(storageKey('progress-v1'), JSON.stringify(STATE.progress)); }catch(e){ console.error('save failed', e); }
}

/* ---- reference images (live lookup, cached globally across all disciplines) ---- */
let IMG_CACHE = {};
async function loadImageCache(){
  try{ const r = await window.storage.get('app-img-cache-v1'); IMG_CACHE = r ? JSON.parse(r.value) : {}; }
  catch(e){ IMG_CACHE = {}; }
}
let _imgSaveTimer = null;
function saveImageCacheDebounced(){
  clearTimeout(_imgSaveTimer);
  _imgSaveTimer = setTimeout(async ()=>{
    try{ await window.storage.set('app-img-cache-v1', JSON.stringify(IMG_CACHE)); }catch(e){}
  }, 800);
}
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
async function fetchWikiImage(query){
  try{
    const r1 = await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=600&format=json&origin=*`);
    const d1 = await r1.json();
    const pages1 = d1 && d1.query && d1.query.pages;
    if(pages1){
      const p = Object.values(pages1)[0];
      if(p && p.thumbnail && p.thumbnail.source) return p.thumbnail.source;
    }
  }catch(e){}
  try{
    const r2 = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`);
    const d2 = await r2.json();
    const pages2 = d2 && d2.query && d2.query.pages;
    if(pages2){
      const p = Object.values(pages2)[0];
      if(p && p.imageinfo && p.imageinfo[0] && p.imageinfo[0].thumburl) return p.imageinfo[0].thumburl;
    }
  }catch(e){}
  return null;
}
async function getImage(query){
  if(Object.prototype.hasOwnProperty.call(IMG_CACHE, query)) return IMG_CACHE[query];
  const url = await fetchWikiImage(query);
  IMG_CACHE[query] = url;
  saveImageCacheDebounced();
  return url;
}
function figureSlot(id, query){
  if(!query) return '';
  return `<div class="figure" data-img-query="${escapeAttr(query)}"><div class="fig-loading">Loading reference image…</div></div>`;
}
function hydrateImages(){
  document.querySelectorAll('.figure[data-img-query]').forEach((node)=>{
    const q = node.getAttribute('data-img-query');
    loadFigureImage(node, q);
  });
}
async function loadFigureImage(node, q){
  node.innerHTML = `<div class="fig-loading">Loading reference image…</div>`;
  let url = null;
  try{ url = await getImage(q); }catch(e){ url = null; }
  if(!node.isConnected) return;
  if(url){
    node.innerHTML = '';
    const img = document.createElement('img');
    img.alt = q;
    img.loading = 'lazy';
    img.onerror = ()=>{ delete IMG_CACHE[q]; saveImageCacheDebounced(); showFigureFailed(node, q); };
    img.src = url;
    const cap = document.createElement('div');
    cap.className = 'fig-cap';
    cap.textContent = 'FIG — ' + q;
    node.appendChild(img);
    node.appendChild(cap);
  } else {
    showFigureFailed(node, q);
  }
}
function showFigureFailed(node, q){
  node.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'fig-loading fig-retry';
  wrap.textContent = 'Reference image unavailable — tap to retry';
  wrap.onclick = ()=>{ delete IMG_CACHE[q]; saveImageCacheDebounced(); loadFigureImage(node, q); };
  node.appendChild(wrap);
}

/* ---- daily deep dive (live Claude call, refreshes once per calendar day, per discipline) ---- */
function storageKeyFor(disc, name){ return DISCIPLINES[disc].prefix + '-' + name; }
let DD_REQUEST_ID = 0;
async function loadDeepDive(force){
  const disc = STATE.discipline;
  const discCfg = DISCIPLINES[disc];
  const myId = ++DD_REQUEST_ID;
  const key = storageKeyFor(disc, 'deepdive-' + todayStr());

  if(!force){
    try{
      const cached = await window.storage.get(key);
      if(cached && cached.value){ STATE.deepDiveCache[disc] = JSON.parse(cached.value); if(STATE.discipline===disc) render(); return; }
    }catch(e){}
  } else {
    try{ await window.storage.delete(key); }catch(e){}
  }

  STATE.deepDiveCache[disc] = 'loading';
  if(STATE.discipline===disc) render();

  const timeoutId = setTimeout(()=>{
    if(myId === DD_REQUEST_ID && STATE.deepDiveCache[disc] === 'loading'){
      STATE.deepDiveCache[disc] = 'timeout';
      if(STATE.discipline===disc) render();
    }
  }, 20000);

  let recentTopics = [];
  try{
    const r = await window.storage.get(storageKeyFor(disc, 'recent-topics'));
    if(r && r.value) recentTopics = JSON.parse(r.value);
  }catch(e){}

  const prompt = `${discCfg.ddIntro}
Generate ${DEEP_DIVE_BATCH_SIZE} fresh "daily deep dive" micro-lessons for today, each on a genuinely different topic within scope. Go a bit beyond basics -- something a practicing engineer would find useful or interesting, not a dictionary definition. Vary the sub-topic and category across the ${DEEP_DIVE_BATCH_SIZE} items so today's set feels varied, not repetitive.
Avoid repeating any of these recently covered topics: ${recentTopics.join(', ') || 'none yet'}.
Respond with ONLY a raw JSON array of exactly ${DEEP_DIVE_BATCH_SIZE} objects, no markdown fences, no preamble, each shaped exactly like this:
{"category":"${discCfg.ddEnum}","topic":"short topic name (3-6 words)","explanation":"3-4 sentences, practical and specific","imageQuery":"2-4 word search term for a real photo or diagram of this concept findable on Wikipedia","question":"a quiz question testing the explanation just given","options":["option A","option B","option C","option D"],"correct":0,"answerExplain":"1-2 sentences on why the correct answer is right"}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 2200,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    let text = (data.content || []).map(b => b.text || '').join('');
    text = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(text);
    const items = Array.isArray(parsed) ? parsed : [parsed];
    if(myId !== DD_REQUEST_ID) return; // a newer request superseded this one
    clearTimeout(timeoutId);
    STATE.deepDiveCache[disc] = items;
    await window.storage.set(key, JSON.stringify(items));
    const newTopics = items.map(it => it.topic).filter(Boolean);
    recentTopics = recentTopics.concat(newTopics);
    if(recentTopics.length > 60) recentTopics = recentTopics.slice(-60);
    await window.storage.set(storageKeyFor(disc, 'recent-topics'), JSON.stringify(recentTopics));
  }catch(e){
    clearTimeout(timeoutId);
    if(myId === DD_REQUEST_ID) STATE.deepDiveCache[disc] = 'error';
  }
  if(STATE.discipline===disc) render();
}
window.retryDeepDive = function(){
  loadDeepDive(true);
};

window.answerDeepDive = function(idx, choice){
  const items = getDeepDive();
  if(!Array.isArray(items) || !items[idx]) return;
  const dd = items[idx];
  const correct = choice === dd.correct;
  const optsDiv = document.getElementById('opts-dd-'+idx);
  Array.from(optsDiv.children).forEach((btn,i)=>{
    btn.onclick = null;
    if(i === dd.correct) btn.classList.add('correct');
    else if(i === choice) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  document.getElementById('explain-dd-'+idx).innerHTML = `<div class="explain"><b>${correct?'Correct.':'Not quite.'}</b> ${dd.answerExplain}</div>`;
  recordAnswer('dd-'+todayStr()+'-'+idx, correct);
  saveProgress();
};

function getDailySession(){
  const deck = getShuffledDeck();
  const n = deck.length;
  const dn = dayNumber();
  const isReviewDay = (new Date().getDay() === 6); // Saturday = review day
  if(isReviewDay){
    const wrongIds = Object.entries(STATE.progress.answered).filter(([id,v])=>v.lastResult===false).map(([id])=>parseInt(id));
    if(wrongIds.length >= 3){
      const items = CD().content.filter(c=>wrongIds.includes(c.id)).slice(0, ITEMS_PER_DAY);
      if(items.length>0) return items;
    }
  }
  const start = (dn * ITEMS_PER_DAY) % n;
  const items = [];
  for(let i=0;i<ITEMS_PER_DAY;i++){
    items.push(deck[(start+i)%n]);
  }
  return items;
}

function isTodayDone(){
  const h = STATE.progress.history[todayStr()];
  return h && h.done;
}

function recordAnswer(id, correct){
  const a = STATE.progress.answered[id] || {correctCount:0, wrongCount:0};
  if(correct) a.correctCount++; else a.wrongCount++;
  a.lastResult = correct;
  STATE.progress.answered[id] = a;
  STATE.progress.totalAnswered = (STATE.progress.totalAnswered||0)+1;
  if(correct) STATE.progress.totalCorrect = (STATE.progress.totalCorrect||0)+1;
}

function completeSession(score, total){
  const t = todayStr();
  STATE.progress.history[t] = {done:true, score, total};
  const streak = STATE.progress.streak;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(streak.lastDate === y || streak.lastDate === t){
    if(streak.lastDate !== t) streak.current += 1;
  } else {
    streak.current = 1;
  }
  streak.lastDate = t;
  streak.longest = Math.max(streak.longest, streak.current);
  saveProgress();
}

  }
  if(dd === 'timeout' || dd === 'error'){
    const msg = dd === 'timeout'
      ? "This is taking longer than expected — the connection may be slow or blocked."
      : "Couldn't reach the network to pull today's fresh topics.";
    return `<div class="section-label">Today's deep dive</div>

      </div>

  }).join('');
  return `

  ${cards}`;

function renderTodayView(){
  const deepDiveHtml = renderDeepDiveCard();
  if(isTodayDone() && STATE.sessionIdx === 0 && STATE.sessionAnswers.length===0){
    const h = STATE.progress.history[todayStr()];
    return `
    ${deepDiveHtml}
    <div class="card done-banner">
      <div class="big">✅</div>
      <h3>Today's session complete</h3>
      <p>Score: ${h.score}/${h.total}. Come back tomorrow for the next set — or head to Explore to browse any topic freely.</p>
    </div>
    <button class="btn ghost" onclick="setView('explore')">BROWSE TOPICS</button>`;
  }

  if(STATE.sessionQueue.length === 0){
    STATE.sessionQueue = getDailySession();
    STATE.sessionIdx = 0;
    STATE.sessionAnswers = [];
  }

  if(STATE.sessionIdx >= STATE.sessionQueue.length){
    const correct = STATE.sessionAnswers.filter(a=>a.correct!==false).length;
    const total = STATE.sessionQueue.length;
    completeSession(correct, total);
    return `
    ${deepDiveHtml}
    <div class="card done-banner">
      <div class="big">🎯</div>
      <h3>Session complete</h3>
      <p>You scored ${correct}/${total} today. Streak is now ${STATE.progress.streak.current} day(s). See you tomorrow.</p>
    </div>
    <button class="btn ghost" onclick="STATE.sessionQueue=[]; STATE.sessionAnswers=[]; render();">BACK TO TODAY</button>`;
  }

  const item = STATE.sessionQueue[STATE.sessionIdx];
  const pct = Math.round((STATE.sessionIdx/STATE.sessionQueue.length)*100);
  let body = '';
  if(item.type==='mcq') body = renderMcq(item, 'session');
  else if(item.type==='flash' || item.type==='code') body = renderFlash(item, 'session');
  else if(item.type==='lesson') body = renderLesson(item, 'session');

  return `
  ${STATE.sessionIdx===0 ? deepDiveHtml : ''}
  <div class="section-label">Today's session — ${STATE.sessionIdx+1} of ${STATE.sessionQueue.length}</div>
  <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
  ${body}`;
}

  const html = items.map(item=>{
    if(item.type==='mcq') return renderMcq(item,'explore');
    if(item.type==='flash' || item.type==='code') return renderFlash(item,'explore');
    if(item.type==='lesson') return renderLesson(item,'explore');
  }).join('');
  return `
  <button class="backbtn" onclick="STATE.exploreCat=null; render();">← All topics</button>
  <div class="section-label">${CD().cats[STATE.exploreCat].icon} ${CD().cats[STATE.exploreCat].name}</div>
  ${html}`;
}
window.openCat = function(key){ STATE.exploreCat = key; render(); };

function renderProgressView(){
  const p = STATE.progress;
  const total = p.totalAnswered||0;
  const correct = p.totalCorrect||0;
  const acc = total>0 ? Math.round((correct/total)*100) : 0;
  const daysActive = Object.values(p.history).filter(h=>h.done).length;

  const catRows = Object.entries(CD().cats).map(([key,c])=>{
    const catItems = CD().content.filter(i=>i.cat===key).map(i=>i.id);
    let seen=0, right=0;
    catItems.forEach(id=>{
      const a = p.answered[id];
      if(a){ seen++; if((a.correctCount||0) > (a.wrongCount||0)) right++; }
    });
    const pct = catItems.length>0 ? Math.round((seen/catItems.length)*100) : 0;
    return `
    <div class="catbar-row">
      <div class="catbar-head"><span>${c.icon} ${c.name}</span><span>${seen}/${catItems.length} seen</span></div>
      <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  // last 28 days calendar
  const cells = [];
  for(let i=27;i>=0;i--){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    const done = p.history[d] && p.history[d].done;
    const isToday = d===todayStr();
    cells.push(`<div class="cal-cell ${done?'done':''} ${isToday?'today':''}"></div>`);
  }

  return `
  <div class="section-label">Your progress</div>
  <div class="statgrid">
    <div class="statbox"><div class="n">${p.streak.current}</div><div class="l">Day streak</div></div>
    <div class="statbox"><div class="n">${p.streak.longest}</div><div class="l">Longest streak</div></div>
    <div class="statbox"><div class="n">${daysActive}</div><div class="l">Days active</div></div>
    <div class="statbox"><div class="n">${acc}%</div><div class="l">Accuracy (${total} answered)</div></div>
  </div>
  <div class="section-label">Topic coverage</div>
  ${catRows}
  <div class="section-label">Last 28 days</div>
  <div class="calendar">${cells.join('')}</div>
  <p style="font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:10px; line-height:1.6;">Saturdays automatically pull in items you previously got wrong for spaced review.</p>
  `;
}

function renderLauncher(){
  const cards = DISC_ORDER.map(key => {
    const d = DISCIPLINES[key];
    return `<button class="disc-card" onclick="selectDiscipline('${key}')">
      <span class="disc-ic">${d.icon}</span>
      <div class="disc-nm">${d.name}</div>
      <div class="disc-sub">${Object.keys(d.cats).length} topic areas</div>
    </button>`;
  }).join('');
  return `
  <div class="launcher-head">
    <div class="crosshair ch-tl"></div><div class="crosshair ch-tr"></div>
    <h1>MEP DAILY</h1>
    <span class="sub">FIELD NOTES — CHOOSE A DISCIPLINE</span>
  </div>
  <div class="disc-grid">${cards}</div>`;
}

window.goToLauncher = function(){
  STATE.screen = 'launcher';
  STATE.discipline = null;
  render();
};

window.selectDiscipline = async function(key){
  STATE.discipline = key;
  STATE.screen = 'app';
  STATE.view = 'today';
  STATE.sessionQueue = [];
  STATE.sessionIdx = 0;
  STATE.sessionAnswers = [];
  STATE.exploreCat = null;
  await loadProgress();
  render();
  loadDeepDive();
  try{ await window.storage.set('app-last-discipline', key); }catch(e){}
};

function render(){
  const app = document.getElementById('app');
  if(STATE.screen === 'launcher'){
    app.innerHTML = renderLauncher();
    return;
  }
  let viewHtml = '';
  if(STATE.view==='today') viewHtml = renderTodayView();
  else if(STATE.view==='explore') viewHtml = renderExploreView();
  else if(STATE.view==='progress') viewHtml = renderProgressView();

  app.innerHTML = `
    ${renderTitleBlock()}
    <div class="view">${viewHtml}</div>
    ${renderTabs()}
  `;
  hydrateImages();
}

window.setView = function(v){
  STATE.view = v;
  STATE.exploreCat = null;
  render();
};

/* manifest.json is linked statically in <head> and served as a real file once hosted.
   Registering a service worker here is what makes the app installable/packageable (PWABuilder/TWA). */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine locally/without hosting; needed once deployed */ });
}

async function init(){
  await loadImageCache();
  let lastDisc = null;
  try{
    const r = await window.storage.get('app-last-discipline');
    if(r && r.value && DISCIPLINES[r.value]) lastDisc = r.value;
  }catch(e){}
  if(lastDisc){
    selectDiscipline(lastDisc);
  } else {
    render();
  }
}
init();
</script>
</body>
</html>
