<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0A2647;
  --bg-deep:#071A33;
  --paper:#0F3460;
  --paper-2:#123a6e;
  --line:#2C5F8A;
  --ink:#DCEEFB;
  --ink-dim:#8FB4D4;
  --ink-faint:#5D85AA;
  --accent:#F2994A;
  --accent-2:#E8B14E;
  --good:#6FCF97;
  --bad:#EB6B6B;
  --mono:'JetBrains Mono', monospace;
  --sans:'Inter', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(0deg, rgba(220,238,251,0.035) 0px, rgba(220,238,251,0.035) 1px, transparent 1px, transparent 28px),
    repeating-linear-gradient(90deg, rgba(220,238,251,0.035) 0px, rgba(220,238,251,0.035) 1px, transparent 1px, transparent 28px),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  font-family:var(--sans);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  padding-bottom:78px;
}

/* ---------- Title block header ---------- */
.titleblock{
  margin:14px 12px 10px;
  border:1.5px solid var(--line);
  background:rgba(15,52,96,0.55);
  border-radius:4px;
  overflow:hidden;
}
.tb-row{display:flex; border-bottom:1px solid var(--line);}
.tb-row:last-child{border-bottom:none;}
.tb-cell{flex:1; padding:8px 10px; border-right:1px solid var(--line);}
.tb-cell:last-child{border-right:none;}
.tb-label{font-family:var(--mono); font-size:9px; letter-spacing:0.08em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:2px;}
.tb-value{font-family:var(--mono); font-size:15px; font-weight:700; color:var(--ink);}
.tb-value.accent{color:var(--accent);}
.tb-title{padding:10px 12px; display:flex; align-items:center; justify-content:space-between;}
.tb-title h1{font-family:var(--mono); font-size:13px; letter-spacing:0.12em; margin:0; color:var(--ink); text-transform:uppercase;}
.tb-title .sub{font-family:var(--mono); font-size:9px; color:var(--ink-faint); letter-spacing:0.06em;}

/* corner crosshair marks */
.crosshair{position:absolute; width:10px; height:10px; pointer-events:none;}
.crosshair::before,.crosshair::after{content:'';position:absolute;background:var(--line);}
.crosshair::before{width:100%;height:1px;top:50%;}
.crosshair::after{width:1px;height:100%;left:50%;}
.ch-tl{top:6px;left:6px;} .ch-tr{top:6px;right:6px;} .ch-bl{bottom:6px;left:6px;} .ch-br{bottom:6px;right:6px;}

/* ---------- Nav tabs ---------- */
.tabs{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  display:flex; background:var(--bg-deep);
  border-top:1.5px solid var(--line);
  z-index:50;
}
.tab{
  flex:1; padding:12px 4px 10px; text-align:center; background:none; border:none;
  color:var(--ink-faint); font-family:var(--mono); font-size:10px; letter-spacing:0.06em;
  text-transform:uppercase; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
}
.tab.active{color:var(--accent);}
.tab-icon{width:18px; height:18px;}

/* ---------- Content area ---------- */
.view{padding:6px 12px 20px; flex:1;}
.section-label{font-family:var(--mono); font-size:10px; letter-spacing:0.1em; color:var(--ink-faint); text-transform:uppercase; margin:18px 0 8px 2px;}

/* ---------- Cards ---------- */
.card{
  position:relative;
  background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
  border:1.5px solid var(--line);
  border-radius:6px;
  padding:18px;
  margin-bottom:12px;
}
.card .cat-tag{
  display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:0.1em;
  color:var(--accent); border:1px solid var(--accent); border-radius:20px; padding:2px 8px; margin-bottom:10px; text-transform:uppercase;
}
.card .type-tag{
  display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:0.1em;
  color:var(--ink-faint); margin-bottom:10px; margin-left:6px; text-transform:uppercase;
}
.card h2{font-family:var(--sans); font-size:16px; font-weight:600; margin:0 0 12px; line-height:1.4; color:var(--ink);}
.card p.body{font-size:14px; line-height:1.6; color:var(--ink-dim); margin:0 0 14px;}

.opt{
  display:block; width:100%; text-align:left; background:rgba(220,238,251,0.04);
  border:1.3px solid var(--line); color:var(--ink); font-family:var(--sans); font-size:14px;
  padding:11px 13px; border-radius:5px; margin-bottom:8px; cursor:pointer; transition:all .15s;
}
.opt:active{transform:scale(0.98);}
.opt.correct{border-color:var(--good); background:rgba(111,207,151,0.14); color:var(--good);}
.opt.wrong{border-color:var(--bad); background:rgba(235,107,107,0.14); color:var(--bad);}
.opt.dim{opacity:0.4;}
.explain{
  margin-top:12px; padding:12px; background:rgba(0,0,0,0.18); border-left:3px solid var(--accent);
  border-radius:3px; font-size:13px; line-height:1.55; color:var(--ink-dim);
}
.explain b{color:var(--accent-2);}

.figure{margin:4px 0 14px; border:1.3px dashed var(--line); border-radius:5px; overflow:hidden; background:rgba(0,0,0,0.15); position:relative;}
.figure img{width:100%; display:block; max-height:220px; object-fit:cover;}
.fig-loading{padding:22px 10px; text-align:center; font-family:var(--mono); font-size:10px; color:var(--ink-faint); letter-spacing:0.05em; text-transform:uppercase;}
.fig-cap{font-family:var(--mono); font-size:9px; letter-spacing:0.06em; color:var(--ink-faint); padding:6px 10px; text-transform:uppercase; border-top:1px solid var(--line); background:rgba(0,0,0,0.2);}
.dd-badge{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--good); margin-right:6px; box-shadow:0 0 6px var(--good);}

/* flashcard */
.flashwrap{perspective:1000px; margin-bottom:12px;}
.flashcard{
  position:relative; min-height:170px; border-radius:6px; cursor:pointer;
  transform-style:preserve-3d; transition:transform .5s;
}
.flashcard.flip{transform:rotateY(180deg);}
.fcface{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:6px;
  border:1.5px solid var(--line); padding:18px; display:flex; flex-direction:column; justify-content:center;
  background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
}
.fcface.back{transform:rotateY(180deg); background:linear-gradient(160deg, #123a6e 0%, #0d2b52 100%); border-color:var(--accent);}
.fcface .hint{font-family:var(--mono); font-size:9px; letter-spacing:0.1em; color:var(--ink-faint); position:absolute; bottom:10px; right:14px; text-transform:uppercase;}
.fcface .txt{font-size:16px; line-height:1.5; color:var(--ink); font-weight:600;}
.fcface.back .txt{font-size:14px; font-weight:400; color:var(--ink-dim);}

.rate-row{display:flex; gap:8px; margin-top:4px;}
.rate-btn{flex:1; padding:10px; border-radius:5px; border:1.3px solid var(--line); background:rgba(220,238,251,0.04); color:var(--ink-dim); font-family:var(--mono); font-size:11px; letter-spacing:0.04em; text-transform:uppercase; cursor:pointer;}
.rate-btn.hard{border-color:var(--bad); color:var(--bad);}
.rate-btn.easy{border-color:var(--good); color:var(--good);}

.btn{
  width:100%; padding:13px; border-radius:5px; border:none; background:var(--accent); color:#1a1005;
  font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; margin-top:6px;
}
.btn:active{transform:scale(0.98);}
.btn.ghost{background:transparent; border:1.3px solid var(--line); color:var(--ink-dim);}

.progressbar{height:5px; background:rgba(220,238,251,0.08); border-radius:3px; overflow:hidden; margin:12px 2px 4px;}
.progressbar-fill{height:100%; background:var(--accent); transition:width .3s;}
.progress-txt{font-family:var(--mono); font-size:10px; color:var(--ink-faint); text-align:right; letter-spacing:0.05em;}

/* stats */
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.statbox{border:1.5px solid var(--line); border-radius:6px; padding:14px; background:rgba(15,52,96,0.4);}
.statbox .n{font-family:var(--mono); font-size:26px; font-weight:800; color:var(--accent);}
.statbox .l{font-family:var(--mono); font-size:9px; letter-spacing:0.08em; color:var(--ink-faint); text-transform:uppercase; margin-top:2px;}

.catbar-row{margin-bottom:12px;}
.catbar-head{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; margin-bottom:5px;}
.catbar-head span:first-child{color:var(--ink); letter-spacing:0.04em;}
.catbar-head span:last-child{color:var(--ink-faint);}
.catbar-track{height:8px; background:rgba(220,238,251,0.08); border-radius:4px; overflow:hidden;}
.catbar-fill{height:100%; background:linear-gradient(90deg, var(--accent-2), var(--accent));}

.calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:6px;}
.cal-cell{aspect-ratio:1; border-radius:3px; background:rgba(220,238,251,0.06); border:1px solid var(--line);}
.cal-cell.done{background:var(--accent); border-color:var(--accent);}
.cal-cell.today{outline:1.5px solid var(--ink);}

/* explore */
.catgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.catcard{
  border:1.5px solid var(--line); border-radius:6px; padding:16px 12px; text-align:left; cursor:pointer;
  background:rgba(15,52,96,0.4); color:var(--ink); font-family:var(--sans);
}
.catcard .ic{font-size:22px; margin-bottom:8px; display:block;}
.catcard .nm{font-weight:700; font-size:13px;}
.catcard .cnt{font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:2px;}

.backbtn{background:none; border:none; color:var(--ink-dim); font-family:var(--mono); font-size:11px; letter-spacing:0.05em; padding:6px 0 14px; cursor:pointer; display:flex; align-items:center; gap:6px;}

.empty-state{text-align:center; padding:40px 20px; color:var(--ink-faint); font-family:var(--mono); font-size:12px; line-height:1.7;}

.done-banner{text-align:center; padding:30px 16px;}
.done-banner .big{font-size:40px; margin-bottom:10px;}
.done-banner h3{font-family:var(--mono); font-size:15px; letter-spacing:0.06em; color:var(--accent); text-transform:uppercase; margin:0 0 8px;}
.done-banner p{color:var(--ink-dim); font-size:13px; line-height:1.6;}
</style>
</head>

<script>
/* ================= CONTENT BANK ================= */
const CONTENT = [
// ---------------- HVAC / ACMV ----------------
{id:1,cat:'HVAC',type:'mcq',q:'In a VRV/VRF refrigerant riser, why is an oil trap (U-bend) installed every 3–4.5m of vertical rise?',opts:['To reduce pipe noise','To ensure compressor oil is carried back up with the refrigerant flow','To allow thermal expansion','To trap refrigerant for servicing'],a:1,e:'At low refrigerant velocities in vertical risers, oil separates and drains back down by gravity. Oil traps collect it so gas velocity can sweep it upward, protecting compressor lubrication.'},
{id:2,cat:'HVAC',type:'flash',f:'What does SHR (Sensible Heat Ratio) tell you?',b:'The proportion of total cooling load that is sensible (temperature) vs latent (moisture removal). SHR = Sensible Load ÷ Total Load. High-humidity spaces (spas, kitchens) need lower SHR equipment.'},
{id:3,cat:'HVAC',type:'mcq',q:'What is the primary purpose of NC (Noise Criteria) curves in HVAC design?',opts:['To size ductwork','To rate equipment cooling capacity','To set acceptable background noise levels in occupied spaces by octave band','To measure static pressure'],a:2,e:'NC/NR curves plot maximum allowable sound pressure per octave band, used to select and locate equipment (AHUs, diffusers, chillers) so occupied spaces meet comfort/acoustic standards.'},
{id:4,cat:'HVAC',type:'lesson',ti:'Chilled water pipe insulation',bd:'Insulation on chilled water pipework is primarily there to prevent condensation on the pipe surface (since pipe temp is below ambient dew point), not just to save energy. Vapor barrier jacketing is critical — any breach lets moisture migrate into the insulation and cause corrosion under insulation (CUI).',q:'What happens if the vapor barrier on chilled water pipe insulation is breached?',opts:['Pipe becomes noisier','Moisture migrates in, causing wet insulation and corrosion under insulation','Flow rate drops','Nothing significant'],a:1,e:'A breached vapor barrier allows humid air to condense inside the insulation, degrading its R-value and corroding the pipe — a very common site defect to check for.'},
{id:5,cat:'HVAC',type:'mcq',q:'CAV vs VAV — what is the key operational difference?',opts:['CAV varies temperature, VAV varies humidity','CAV supplies constant airflow at varying temperature; VAV varies airflow to maintain temperature','VAV only works in winter','CAV is only for exhaust systems'],a:1,e:'Constant Air Volume (CAV) systems modulate supply air temperature to meet load at a fixed flow rate. Variable Air Volume (VAV) systems keep supply air temp roughly constant and throttle the volume via VAV boxes/dampers to meet zone load — more energy efficient for varying loads.'},
{id:6,cat:'HVAC',type:'flash',f:'What is a VFD (Variable Frequency Drive) used for on an AHU fan or pump?',b:'It varies the electrical frequency supplied to the motor, changing its rotational speed. This lets fans/pumps match actual demand instead of running at full speed with dampers/valves throttling — saving significant energy (affinity laws: power ∝ speed³).'},
{id:7,cat:'HVAC',type:'mcq',q:'Why is a balancing valve installed on each branch of a hydronic (chilled/hot water) distribution loop?',opts:['To isolate the branch for maintenance only','To measure and set the correct flow rate to each branch so all terminals get design flow','To prevent water hammer','To filter debris'],a:1,e:'Without balancing, water takes the path of least resistance and the branches closest to the pump get excess flow while distant ones get starved. Balancing valves (with flow measurement ports) let commissioning engineers set each branch to its design flow.'},
{id:8,cat:'HVAC',type:'flash',f:'Butterfly valve vs gate valve for HVAC isolation — which is more common on large chilled water mains and why?',b:'Butterfly valves — they are compact, lightweight, quick to operate (quarter-turn), and cost-effective at large diameters. Gate valves are bulkier and slower to operate but give a fully unobstructed bore when open, sometimes preferred on critical low-pressure-drop lines.'},
{id:9,cat:'HVAC',type:'mcq',q:'What is the function of an expansion tank in a closed hydronic loop?',opts:['To store extra water for fire fighting','To absorb the volumetric expansion of water as it heats up, controlling system pressure','To remove air from the system','To boost pump pressure'],a:1,e:'Water expands as it heats. In a closed loop this would spike pressure dangerously without somewhere to go — the expansion tank (bladder or diaphragm type) accommodates that volume change and keeps system pressure within safe limits.'},
{id:10,cat:'HVAC',type:'flash',f:'TXV — what does it stand for and what does it do?',b:'Thermostatic Expansion Valve. It meters refrigerant flow into the evaporator based on superheat, maintaining efficient evaporator performance across varying load conditions — more precise than a fixed orifice.'},
{id:11,cat:'HVAC',type:'mcq',q:'Why must refrigerant pipe sizing keep gas velocity within a specific range (not just "big enough")?',opts:['Only to reduce noise','Too low a velocity fails to carry oil back to the compressor; too high causes excess pressure drop and noise','To match compressor color coding','Velocity has no real design impact'],a:1,e:'Refrigerant piping is a balance: minimum velocity (~2.5–3 m/s typical vertical minimum) ensures oil entrainment back to the compressor, while a maximum limits pressure drop, noise, and pipe erosion.'},
{id:12,cat:'HVAC',type:'flash',f:'AHU vs FCU — what is the core difference?',b:'An AHU (Air Handling Unit) is typically a larger central unit conditioning air for multiple zones via ductwork, often with fresh air intake, filtration, and coils. An FCU (Fan Coil Unit) is a smaller, usually zone-level unit with a coil and fan, often served by a central chilled/hot water plant.'},
{id:13,cat:'HVAC',type:'mcq',q:'Why does an AC condensate drain line need a P-trap?',opts:['To collect debris','To prevent negative pressure in the unit from pulling odors/air back through the drain, and to maintain drainage seal','To slow the water down','It is purely decorative'],a:1,e:'The AHU/FCU operates under slight negative pressure. Without a trap, that pressure would suck air (and odors, insects) back up the condensate line, or air lock could prevent proper drainage.'},
{id:14,cat:'HVAC',type:'lesson',ti:'Cooling tower Range & Approach',bd:'Range is the temperature drop of water across the tower (inlet minus outlet). Approach is how close the tower gets the water to the ambient wet-bulb temperature (outlet water temp minus wet-bulb). A smaller approach means a more efficient, typically larger/costlier tower.',q:'A cooling tower has water entering at 35°C and leaving at 29.5°C, with ambient wet-bulb at 27°C. What is the approach?',opts:['5.5°C (the range)','2.5°C','8°C','29.5°C'],a:1,e:'Approach = leaving water temp − wet-bulb = 29.5 − 27 = 2.5°C. Range = 35 − 29.5 = 5.5°C. These are two different, commonly confused metrics.'},
{id:15,cat:'HVAC',type:'flash',f:'What does staircase pressurization (per BS EN 12101-6 / NFPA 92) achieve during a fire?',b:'It maintains a positive air pressure in the escape stair relative to the fire floor, preventing smoke ingress into the protected escape route so occupants can evacuate safely.'},
// ---------------- FIRE PROTECTION ----------------
{id:16,cat:'FIRE',type:'mcq',q:'Per NFPA 13, what is the general principle behind sprinkler spacing limits?',opts:['Purely aesthetic ceiling layout','Each sprinkler must adequately wet its protection area based on hazard classification and maximum coverage area','Spacing is fixed at 2m regardless of hazard','Spacing only depends on pipe size'],a:1,e:'NFPA 13 sets maximum coverage area per sprinkler and maximum spacing between heads/from walls, varying by hazard classification (light/ordinary/extra) and sprinkler type, to ensure adequate water distribution over the protected area.'},
{id:17,cat:'FIRE',type:'flash',f:'OS&Y valve — what does it stand for and why is it used on fire protection mains?',b:'Outside Screw and Yoke. The valve stem is visible outside the valve body, showing at a glance whether the valve is open or closed — critical for fire protection isolation valves that must never be left unknowingly closed.'},
{id:18,cat:'FIRE',type:'mcq',q:'What is the purpose of a fire pump "churn" (no-flow / shutoff) test?',opts:['To test the fire alarm panel','To verify the pump can run safely at zero flow (shutoff head) without overheating, and confirm rated shutoff pressure','To calibrate sprinkler heads','To test the jockey pump only'],a:1,e:'The churn test runs the fire pump against a closed valve to verify shutoff pressure matches the pump curve and that the pump (and its minimum flow/relief valve) can handle no-flow conditions without damage.'},
{id:19,cat:'FIRE',type:'flash',f:'Wet pipe vs dry pipe sprinkler system — when is a dry system used?',b:'Wet pipe systems (water-filled, fastest response) are the default. Dry pipe systems (pressurized air, water held back by a dry valve) are used where pipes could freeze — unheated spaces, cold stores — since water in the pipe would freeze and burst it.'},
{id:20,cat:'FIRE',type:'mcq',q:'What triggers a deluge valve to open and release water to all sprinkler/nozzle heads simultaneously?',opts:['Manual valve only, never automatic','A separate fire detection system (heat/smoke/flame detectors), since deluge heads are open (no individual triggers)','Water pressure drop alone','Time delay after building occupancy'],a:1,e:'Deluge systems use open nozzles/sprinklers (no individual heat-sensitive element), so a separate detection system is needed to open the deluge valve and flood the whole zone at once — used for high-hazard areas needing instant total coverage.'},
{id:21,cat:'FIRE',type:'lesson',ti:'NFPA 20 fire pump relief valve',bd:'A pressure relief valve on a fire pump discharge protects the system from over-pressurization at churn (shutoff) conditions or low-flow high-pressure operation, especially relevant with steep pump curves or where the pump\'s churn pressure could exceed piping/component pressure ratings.',q:'Why might a fire pump specifically need a pressure relief valve per NFPA 20?',opts:['To increase flow at high demand','To prevent system components from being over-pressurized at shutoff/low-flow conditions where pump discharge pressure peaks','To reduce noise','To filter water quality'],a:1,e:'At shutoff (churn) or low flow, centrifugal fire pumps produce their highest discharge pressure. If this exceeds the rated working pressure of piping, valves, or hose connections, a relief valve bypasses excess flow back to suction/tank to cap the pressure.'},
{id:22,cat:'FIRE',type:'flash',f:'What is the difference between standpipe Class I, II, and III systems?',b:'Class I: 65mm (2.5") hose connections for fire department use only. Class II: 38mm (1.5") hose stations for trained occupant use. Class III: combines both — 65mm connections for fire dept. and 38mm hose stations for occupants.'},
{id:23,cat:'FIRE',type:'mcq',q:'What does an alarm check valve do in a wet pipe sprinkler system?',opts:['Stops all water flow permanently','Allows water to flow to sprinklers while triggering a water-flow alarm, and prevents backflow into the supply','Only tests pressure once a year','Regulates sprinkler head temperature rating'],a:1,e:'The alarm check valve is a one-way (check) valve with a trim assembly that diverts a small flow to a water motor gong / pressure switch when a sprinkler activates and water flows — providing the alarm signal.'},
{id:24,cat:'FIRE',type:'flash',f:'Why are sprinkler bulb/link colors coded by temperature rating?',b:'The color (e.g. orange 57°C, red 68°C, yellow 79°C, green 93°C, blue 141°C) lets installers and inspectors instantly verify the correct temperature-rated head is installed for the area\'s expected ambient/ceiling temperature — critical near kitchens, boiler rooms, etc.'},
{id:25,cat:'FIRE',type:'mcq',q:'Why is CO2 clean-agent fire suppression restricted to unoccupied or evacuated spaces, unlike FM-200 or Novec 1230?',opts:['CO2 is more expensive','CO2 extinguishes by displacing oxygen to a level that is also lethal to humans; FM-200/Novec extinguish chemically at oxygen-safe concentrations','CO2 is corrosive to equipment','CO2 takes too long to discharge'],a:1,e:'CO2 works by reducing oxygen concentration below combustion-supporting levels — which is also below what a person can safely breathe. FM-200 and Novec 1230 interrupt the chemical combustion reaction and can be used at concentrations considered safe for brief human exposure.'},
{id:26,cat:'FIRE',type:'flash',f:'PIV — what does it stand for in fire protection?',b:'Post Indicator Valve. An underground gate valve with an above-ground indicator post showing OPEN/SHUT status, used to isolate underground fire mains while allowing visual confirmation the valve is open.'},
{id:27,cat:'FIRE',type:'mcq',q:'What is the main functional difference between a hose reel and a fire hydrant landing valve in a building?',opts:['No difference, same equipment','Hose reels are small-bore, fixed-hose occupant-use first-response devices; hydrant landing valves supply large-bore hose for fire brigade use','Hydrants are only for outdoor use','Hose reels only work with foam'],a:1,e:'Hose reels (typically 25mm, fixed rubber hose) are for building occupants to tackle a fire at incipient stage. Hydrant/landing valve outlets (65mm) supply canvas hose for trained fire brigade personnel delivering much higher flow.'},
{id:28,cat:'FIRE',type:'flash',f:'What is a fire pump "jockey pump" for?',b:'A small pump that maintains system pressure against minor leaks/pressure fluctuations, preventing the much larger main fire pump from cycling on/off unnecessarily for tiny pressure drops.'},
{id:29,cat:'FIRE',type:'mcq',q:'In NFPA 13, what is the purpose of an inspector\'s test valve on a sprinkler system?',opts:['To manually discharge water for cleaning','To simulate the flow of a single sprinkler head activating, verifying the waterflow alarm functions correctly','To test smoke detectors','To pressurize the dry pipe system'],a:1,e:'Opening the inspector\'s test valve releases water equivalent to one sprinkler head orifice, confirming the alarm check valve, waterflow switch, and alarm signal chain work as intended — a standard periodic test.'},
{id:30,cat:'FIRE',type:'flash',f:'Why do fire pump rooms typically require both an electric pump and a diesel-driven backup pump?',b:'Redundancy against loss of electrical power during a fire event — a diesel pump can operate independently of the building/grid electrical supply, ensuring water supply continuity if power fails.'},
// ---------------- PLUMBING / HYDRAULICS ----------------
{id:31,cat:'PLUMB',type:'mcq',q:'What is the main purpose of a grease interceptor in a kitchen drainage line?',opts:['To increase flow velocity','To trap fats, oils, and grease before they enter the sewer/STP and solidify, causing blockages','To disinfect wastewater','To measure flow rate'],a:1,e:'FOG (fats, oils, grease) cools and solidifies in pipework, causing blockages and interfering with downstream treatment. The interceptor slows flow so grease floats and separates before the effluent continues to the sewer.'},
{id:32,cat:'PLUMB',type:'flash',f:'Air gap vs mechanical backflow preventer — which is the more reliable method of preventing contamination of potable water?',b:'An air gap (a physical, visible vertical separation between the water outlet and the flood level of a fixture) is the most reliable — it has no moving parts to fail. Mechanical devices (RPZ, check valves) are effective but can fail and need periodic testing.'},
{id:33,cat:'PLUMB',type:'mcq',q:'Why does a drainage system need venting (vent stacks/pipes)?',opts:['To reduce pipe cost','To equalize pressure so trap seals aren\'t siphoned or blown, and to release sewer gases safely','To increase water pressure','Venting is optional in all codes'],a:1,e:'Without venting, discharging fixtures create pressure fluctuations that can siphon (self-siphonage) or push out (back pressure) the water seal in P-traps, allowing foul sewer gas into occupied spaces. Vents also allow air to enter/escape, keeping flow smooth.'},
{id:34,cat:'PLUMB',type:'flash',f:'Swing check valve vs spring-loaded (silent) check valve — why does installation orientation matter more for a swing check?',b:'A swing check valve relies on gravity to close its hinged disc, so it typically must be installed with correct flow direction and often horizontally or with the hinge properly oriented, or it may not seat correctly / slam shut (water hammer). Spring-loaded checks close positively regardless of orientation and close faster, reducing water hammer.'},
{id:35,cat:'PLUMB',type:'mcq',q:'What is a pressure reducing valve (PRV) used for in a domestic water supply riser?',opts:['To increase pump speed','To reduce and stabilize downstream pressure to a safe level for fixtures and pipework, especially at lower floors of tall buildings','To filter sediment','To mix hot and cold water'],a:1,e:'Static pressure increases with building height (from the source/tank). A PRV reduces this to within fixture-rated limits (commonly ~3.5 bar max at outlets) preventing pipe/fitting damage, noise, and excessive fixture wear.'},
{id:36,cat:'PLUMB',type:'flash',f:'What is a water hammer arrestor and why is it needed?',b:'A device (often an air cushion/piston chamber) installed near quick-closing valves (solenoid valves, washing machines) that absorbs the pressure surge (water hammer) created when flow is suddenly stopped, protecting pipework and joints from shock damage and noise.'},
{id:37,cat:'PLUMB',type:'mcq',q:'What is the main reason for hot water recirculation systems in large buildings/resorts?',opts:['To save water only','To ensure hot water is available quickly at fixtures without waiting/wasting water while the line purges, by continuously circulating hot water through a loop back to the heater','To pre-cool water','To increase pipe pressure'],a:1,e:'Without recirculation, hot water sits in long branch pipes and cools between uses — guests wait and waste water running the tap until hot water arrives. A recirculation loop keeps water near set temperature at the fixture takeoff point at all times.'},
{id:38,cat:'PLUMB',type:'lesson',ti:'STP basic treatment stages',bd:'A typical Sewage Treatment Plant (STP) for a resort follows: (1) Screening/preliminary treatment removing solids/grit, (2) Primary treatment (settling), (3) Secondary biological treatment (activated sludge/MBBR/MBR — using microorganisms to break down organic matter), (4) Tertiary treatment (filtration/disinfection, often UV or chlorination) before discharge or reuse (e.g. irrigation).',q:'Which stage of STP treatment primarily uses microorganisms to break down dissolved organic matter?',opts:['Screening','Primary settling','Secondary biological treatment','Chlorination'],a:2,e:'Secondary treatment is biological — aerobic microorganisms consume organic pollutants, converting them into biomass (sludge) and gases, significantly reducing BOD/COD before tertiary polishing.'},
{id:39,cat:'PLUMB',type:'flash',f:'What is the function of an RO/SWRO membrane in a water treatment system?',b:'Reverse Osmosis (RO) / Seawater RO membranes remove dissolved salts and impurities by forcing water through a semi-permeable membrane under high pressure, rejecting dissolved solids — used for desalination or producing high-purity process water.'},
{id:40,cat:'PLUMB',type:'mcq',q:'Gate valve vs globe valve — which is better suited for throttling (partially controlling) flow, and why?',opts:['Gate valve — its wedge design throttles smoothly','Globe valve — its S-shaped flow path and disc/seat design give better control and less seat erosion when partially open','Both are equally suited','Neither should ever be throttled'],a:1,e:'Gate valves are designed for full-open/full-closed (on/off) service — partial opening causes turbulence, vibration, and erosion of the gate/seat. Globe valves\' geometry is designed to handle the turbulence of partial flow control gracefully, making them the correct choice for throttling duty.'},
{id:41,cat:'PLUMB',type:'flash',f:'Why should unions (or flanged joints) be installed near pumps, valves, and equipment rather than relying on the pipe run alone?',b:'Unions allow quick disconnection of pipework for equipment removal, maintenance, or replacement without cutting pipe or disturbing the whole system — essential serviceability detailing.'},
{id:42,cat:'PLUMB',type:'mcq',q:'What is the primary purpose of a strainer installed on the suction side of a pump?',opts:['To increase suction pressure','To catch debris/solids before they enter and damage the pump impeller or clog downstream equipment','To silence the pump','To cool the motor'],a:1,e:'Debris entering pump suction can damage impellers, seals, and bearings, or pass through to clog downstream fittings/nozzles. A strainer (Y-type or basket) protects the pump and system, though it must be sized to avoid excess pressure drop and needs periodic cleaning.'},
{id:43,cat:'PLUMB',type:'flash',f:'What is the purpose of a floor drain trap primer?',b:'It periodically (or continuously via small flow) adds water to floor drains that are infrequently used, replenishing the trap seal water that would otherwise evaporate over time, which would let sewer gas escape into the space.'},
{id:44,cat:'PLUMB',type:'mcq',q:'What is the key design purpose of an invert level in gravity drainage design?',opts:['The invert is decorative and has no engineering function','The invert (inside bottom of pipe) level determines the achievable gradient/fall for gravity flow and connection depths between manholes/fixtures','It only matters for pressurized systems','Invert levels are fixed by manufacturer standard regardless of site'],a:1,e:'Gravity drainage relies on falling invert levels along the pipe run to maintain self-cleansing velocity. Engineers calculate invert levels at each manhole/connection to ensure adequate fall while avoiding excessive depth (cost) or clashes with other services.'},
{id:45,cat:'PLUMB',type:'flash',f:'Why is a vent cowl height above roof level specified in plumbing codes?',b:'To ensure sewer gases discharged from the vent stack disperse safely away from windows, air intakes, and occupied areas, and to prevent rain/debris ingress into the vent pipe.'},
// ---------------- ELECTRICAL & BMS ----------------
{id:46,cat:'ELEC',type:'mcq',q:'What are the main functions of a BMS (Building Management System) from an MEP coordination perspective?',opts:['Only fire alarm monitoring','Centralized monitoring and control of HVAC, lighting, and other building systems for efficiency, comfort, and fault diagnostics','Only electrical billing','Only CCTV monitoring'],a:1,e:'A BMS integrates control and monitoring points (temperatures, valve/damper positions, equipment status/alarms) across HVAC, lighting, and other systems, enabling scheduling, optimization, and centralized fault detection — MEP engineers must coordinate points lists and interfaces with the BMS.'},
{id:47,cat:'ELEC',type:'flash',f:'Besides energy saving, why is a VFD often specified on a pump/fan instead of a simple on/off starter?',b:'It allows soft-start (reducing inrush current and mechanical stress), precise speed matching to demand (protecting against cavitation, oversizing losses), and can extend equipment life by avoiding full-speed hard starts/stops.'},
{id:48,cat:'ELEC',type:'mcq',q:'What is the purpose of an ATS (Automatic Transfer Switch) in a building electrical system?',opts:['To transfer data between BMS panels','To automatically switch the building load from utility power to standby generator power (and back) upon power failure/restoration','To convert AC to DC','To balance three-phase loads'],a:1,e:'An ATS senses loss of the primary (utility) supply, signals the standby generator to start, and once stable, transfers critical loads to the generator — then reverses the transfer when utility power is restored, typically with a time delay to avoid nuisance switching.'},
{id:49,cat:'ELEC',type:'flash',f:'Why do motors (pumps, fans, compressors) need overload protection separate from the circuit breaker?',b:'A circuit breaker protects against short-circuit/fault currents, but overload relays protect against sustained excess current from mechanical overload (e.g. jammed pump, blocked fan) that wouldn\'t trip a breaker quickly enough to prevent motor winding damage from heat buildup.'},
{id:50,cat:'ELEC',type:'mcq',q:'An MEP engineer sees equipment rated IP65. What does this tell them about installation location suitability?',opts:['It is rated for underwater submersion','It is dust-tight and protected against water jets from any direction — suitable for many exterior/wet plant room locations but not submersion','It is only rated for indoor dry locations','IP rating relates to electrical voltage, not ingress protection'],a:1,e:'IP ratings: first digit (6) = dust-tight; second digit (5) = protected against water jets from any direction. IP65 suits most plant rooms and covered exterior locations, but submersible applications need IP67/IP68.'},
{id:51,cat:'ELEC',type:'flash',f:'Soft starter vs VFD for a pump — what is the key functional difference?',b:'A soft starter only reduces starting current/torque during startup and ramps up to full fixed speed, then effectively acts as a bypass at run speed. A VFD continuously varies motor speed throughout operation, enabling ongoing flow/pressure matching, not just a gentle start.'},
// ---------------- VALVES & EQUIPMENT (practical/general) ----------------
{id:52,cat:'VALVE',type:'mcq',q:'Ball valve vs gate valve — which is generally preferred for frequent on/off operation, and why?',opts:['Gate valve, because it seals tighter over time','Ball valve, because its quarter-turn operation is fast, reliable, and it provides tight shutoff even after infrequent long idle periods','Neither is suitable for on/off duty','Gate valve, because it is cheaper at all sizes'],a:1,e:'Ball valves give quick quarter-turn operation and dependable bubble-tight shutoff, and don\'t suffer from the seizing/binding that gate valves can develop if left in one position a long time — making them the go-to for frequent isolation duty, especially at smaller diameters.'},
{id:53,cat:'VALVE',type:'flash',f:'What is the basic purpose of any check (non-return) valve?',b:'To allow flow in one direction only, automatically closing to prevent reverse/backflow — protecting pumps from backspin/damage and preventing contamination or drain-back in a system.'},
{id:54,cat:'VALVE',type:'mcq',q:'Why are butterfly valves generally not ideal for precise throttling at very low flow rates?',opts:['They are too expensive','Their disc characteristic gives most of the flow change in a small portion of the travel near closed, making fine control difficult and prone to cavitation/vibration at low openings','They cannot be automated','They only work with gases'],a:1,e:'A butterfly valve\'s flow-vs-opening curve is highly non-linear — a small movement near the closed position changes flow drastically, making fine, stable throttling difficult compared to a globe or characterized control valve.'},
{id:55,cat:'VALVE',type:'flash',f:'What does a pressure relief valve (PRV / safety valve) do, and how does it differ from a pressure reducing valve?',b:'A pressure RELIEF valve is a safety device that opens to vent excess pressure when a set threshold is exceeded, protecting equipment/piping from over-pressure damage. A pressure REDUCING valve continuously modulates to maintain a lower, stable downstream pressure during normal operation — different purposes entirely, despite the similar name.'},
{id:56,cat:'VALVE',type:'mcq',q:'Y-strainer vs basket strainer — what is the key practical difference in application?',opts:['No real difference, interchangeable always','Y-strainers are compact and suit smaller lines/lower debris loads; basket strainers hold more debris and are used on larger lines needing less frequent cleaning','Basket strainers are only for gases','Y-strainers can only be installed vertically'],a:1,e:'Y-strainers have a smaller screen capacity and are common on smaller branch lines. Basket strainers have a much larger surface area/debris-holding capacity, suited to larger mains or dirtier fluids where frequent cleaning of a Y-strainer would be impractical.'},
{id:57,cat:'VALVE',type:'flash',f:'Why is a flexible connector (rubber/braided) often installed at a pump\'s suction and discharge?',b:'It absorbs pump vibration and noise so it isn\'t transmitted into the rigid pipework/structure, and it accommodates slight misalignment or thermal movement between the pump and piping.'},
{id:58,cat:'VALVE',type:'mcq',q:'What is cavitation in a pump, and what commonly causes it?',opts:['Overheating of the motor windings','Formation and violent collapse of vapor bubbles when local pressure drops below the fluid\'s vapor pressure, often due to insufficient NPSH available at the suction','Excess flow through the pump','Electrical phase imbalance'],a:1,e:'Cavitation occurs when suction-side pressure drops enough (due to friction losses, elevation, high suction lift, or valve throttling) for the liquid to locally vaporize; the bubbles collapse violently on the impeller, causing noise, vibration, and pitting damage over time.'},
{id:59,cat:'VALVE',type:'flash',f:'What does NPSH stand for and why does it matter for pump selection?',b:'Net Positive Suction Head. NPSH available (from the system) must exceed NPSH required (by the pump, from its curve) with margin, or the pump will cavitate — a critical check especially for pumps with suction lift or hot/volatile fluids.'},
{id:60,cat:'VALVE',type:'mcq',q:'Why should isolation valves be provided on both sides of a piece of equipment (pump, coil, valve, filter), not just one?',opts:['Purely a code formality with no functional reason','So the equipment can be fully isolated from both upstream and downstream system pressure/flow for maintenance or replacement without draining or shutting down the whole system','To increase flow resistance intentionally','Only required for equipment over a certain size'],a:1,e:'A single isolation valve leaves the equipment exposed to pressure/flow from the other side. Valves on both sides allow full isolation for safe maintenance, filter changes, or equipment swap-out while the rest of the system stays operational.'},
{id:61,cat:'VALVE',type:'flash',f:'What is a "spool piece" and why is it useful in equipment piping layouts?',b:'A removable straight pipe section (often with flanged ends) inserted between two points, allowing that section to be taken out to create working clearance for equipment removal/maintenance, or to allow future insertion of a meter/strainer/valve.'},
{id:62,cat:'VALVE',type:'mcq',q:'What is the purpose of a non-slam / silent check valve compared to a standard swing check valve on a pump discharge?',opts:['It costs less always','It closes quickly and smoothly (often spring-assisted) as flow reverses, preventing the water hammer "slam" caused by a standard swing check\'s disc banging shut','It only works on suction lines','It eliminates the need for isolation valves'],a:1,e:'When a pump stops, flow can reverse briefly before a standard swing check slams shut, causing a pressure shock (water hammer) and noise. Silent/non-slam checks close just as flow reaches zero, avoiding the slam — common on pump discharge in parallel pump arrangements.'},
// ---------------- POOLS / SPA / WATER FEATURES ----------------
{id:63,cat:'POOL',type:'mcq',q:'In infinity pool design, what is the Francis Weir Formula used to calculate?',opts:['Pump total dynamic head','The flow rate of water spilling over the weir edge, based on weir length and head of water over it','Chemical dosing rate','Pipe insulation thickness'],a:1,e:'The Francis Weir Formula (Q = 1.84 × L × H^1.5, in SI form, with weir coefficient adjustments) relates flow rate over a weir to its effective length and the head of water over the crest — used to size the infinity edge flow and downstream catch basin/gutter and balancing tank pump capacity.'},
{id:64,cat:'POOL',type:'flash',f:'What is the role of a balancing tank in an infinity edge pool system?',b:'It collects the water that continuously spills over the infinity edge into the catch basin, providing a reservoir from which the circulation pump draws — buffering the varying volume caused by bather displacement and evaporation so the visual effect and pump supply stay stable.'},
{id:65,cat:'POOL',type:'mcq',q:'Why might UV disinfection be used alongside (not instead of) chlorine in a decorative water feature or pool?',opts:['UV replaces the need for any filtration','UV inactivates chlorine-resistant pathogens (like Cryptosporidium) and reduces chloramine formation, while chlorine still provides a residual disinfectant in the water','UV is only used for aesthetic clarity','UV eliminates the need for circulation pumps'],a:1,e:'Chlorine alone struggles against certain resistant organisms and produces combined chlorine (chloramines) with organic load from bathers. UV provides an additional disinfection barrier and helps break down chloramines, while chlorine maintains a protective residual throughout the water body — commonly paired, not substituted.'},
{id:66,cat:'POOL',type:'flash',f:'What is the purpose of a hair and lint strainer before a pool circulation pump?',b:'It catches hair, leaves, and debris before they reach the pump impeller, preventing clogging, impeller damage, and loss of circulation efficiency — positioned upstream of the pump, easily accessible for regular cleaning.'},
{id:67,cat:'POOL',type:'mcq',q:'What does "turnover rate" mean in swimming pool circulation design?',opts:['How often the pool water is fully replaced with fresh water','The time taken for the circulation system to filter/treat a volume of water equal to the total pool volume once','The rotational speed of the pump impeller','How often chemicals are dosed'],a:1,e:'Turnover rate/period is the time for the full pool volume to pass through the filtration and treatment system once (e.g. commercial pools often target 4-6 hours). It drives the required circulation flow rate: Flow = Pool Volume ÷ Turnover Period.'},
{id:68,cat:'POOL',type:'flash',f:'Why is chemical dosing (chlorine/pH) typically injected after the filter, not before?',b:'Dosing after filtration ensures the disinfectant/pH-adjusting chemical isn\'t partially consumed or filtered out before reaching the pool, and avoids potential chemical reactions with debris/organics fouling the filter media.'},
];

function seededShuffle(arr, seed){
  const a = arr.slice();
  let s = seed;
  for(let i=a.length-1;i>0;i--){
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s/233280)*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

    const res = await window.storage.get('mep-progress-v1');
    STATE.progress = res ? JSON.parse(res.value) : defaultProgress();

async function fetchWikiImage(query){
  try{
    const r1 = await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=600&format=json&origin=*`);
    const d1 = await r1.json();
    const pages1 = d1 && d1.query && d1.query.pages;
    if(pages1){
      const p = Object.values(pages1)[0];
      if(p && p.thumbnail && p.thumbnail.source) return p.thumbnail.source;
    }
  }catch(e){}
  try{
    const r2 = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`);
    const d2 = await r2.json();
    const pages2 = d2 && d2.query && d2.query.pages;
    if(pages2){
      const p = Object.values(pages2)[0];
      if(p && p.imageinfo && p.imageinfo[0] && p.imageinfo[0].thumburl) return p.imageinfo[0].thumburl;
    }
  }catch(e){}
  return null;
}
async function getImage(query){
  if(Object.prototype.hasOwnProperty.call(IMG_CACHE, query)) return IMG_CACHE[query];
  const url = await fetchWikiImage(query);
  IMG_CACHE[query] = url;
  saveImageCacheDebounced();
  return url;
}
function figureSlot(id, query){
  if(!query) return '';
  return `<div class="figure" data-img-query="${escapeAttr(query)}"><div class="fig-loading">Loading reference image…</div></div>`;
}
function hydrateImages(){
  document.querySelectorAll('.figure[data-img-query]').forEach(async (node)=>{
    const q = node.getAttribute('data-img-query');
    const url = await getImage(q);
    if(!node.isConnected) return;
    if(url){
      node.innerHTML = `<img src="${url}" alt="${escapeAttr(q)}" loading="lazy"><div class="fig-cap">FIG — ${q}</div>`;
    } else {
      node.remove();
    }
  });
}

/* ---- daily deep dive (live Claude call, refreshes once per calendar day) ---- */
async function loadDeepDive(){
  const key = 'mep-deepdive-' + todayStr();
  try{
    const cached = await window.storage.get(key);
    if(cached && cached.value){ STATE.deepDive = JSON.parse(cached.value); render(); return; }
  }catch(e){}

  STATE.deepDive = 'loading';
  render();

  let recentTopics = [];
  try{
    const r = await window.storage.get('mep-recent-topics');
    if(r && r.value) recentTopics = JSON.parse(r.value);
  }catch(e){}

  const prompt = `You are an MEP (Mechanical, Electrical, Plumbing) engineering trainer writing for an experienced practicing MEP engineer who works on resort/hospitality projects (HVAC, fire protection, plumbing/hydraulics, electrical/BMS, valves, pools & water features).
Generate ONE fresh "daily deep dive" micro-lesson. Go a bit beyond basics -- something a practicing engineer would find genuinely useful or interesting, not a dictionary definition.
Avoid repeating these recently covered topics: ${recentTopics.join(', ') || 'none yet'}.
Respond with ONLY raw JSON, no markdown fences, no preamble, in exactly this shape:
{"category":"HVAC|FIRE|PLUMB|ELEC|VALVE|POOL","topic":"short topic name (3-6 words)","explanation":"3-4 sentences, practical and specific","imageQuery":"2-4 word search term for a real photo or diagram of this concept findable on Wikipedia","question":"a quiz question testing the explanation just given","options":["option A","option B","option C","option D"],"correct":0,"answerExplain":"1-2 sentences on why the correct answer is right"}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    let text = (data.content || []).map(b => b.text || '').join('');
    text = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(text);
    STATE.deepDive = parsed;
    await window.storage.set(key, JSON.stringify(parsed));
    recentTopics.push(parsed.topic);
    if(recentTopics.length > 10) recentTopics = recentTopics.slice(-10);
    await window.storage.set('mep-recent-topics', JSON.stringify(recentTopics));
  }catch(e){
    STATE.deepDive = 'error';
  }
  render();
}

window.answerDeepDive = function(choice){
  const dd = STATE.deepDive;
  if(!dd || dd === 'loading' || dd === 'error') return;
  const correct = choice === dd.correct;
  const optsDiv = document.getElementById('opts-dd');
  Array.from(optsDiv.children).forEach((btn,i)=>{
    btn.onclick = null;
    if(i === dd.correct) btn.classList.add('correct');
    else if(i === choice) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  document.getElementById('explain-dd').innerHTML = `<div class="explain"><b>${correct?'Correct.':'Not quite.'}</b> ${dd.answerExplain}</div>`;
  recordAnswer('dd-'+todayStr(), correct);
  saveProgress();
};

function getDailySession(){
  const n = SHUFFLED_DECK.length;
  const dn = dayNumber();
  const isReviewDay = (new Date().getDay() === 6); // Saturday = review day
  if(isReviewDay){
    const wrongIds = Object.entries(STATE.progress.answered).filter(([id,v])=>v.lastResult===false).map(([id])=>parseInt(id));
    if(wrongIds.length >= 3){
      const items = CONTENT.filter(c=>wrongIds.includes(c.id)).slice(0, ITEMS_PER_DAY);
      if(items.length>0) return items;
    }
  }
  const start = (dn * ITEMS_PER_DAY) % n;
  const items = [];
  for(let i=0;i<ITEMS_PER_DAY;i++){
    items.push(SHUFFLED_DECK[(start+i)%n]);
  }
  return items;
}

function isTodayDone(){
  const h = STATE.progress.history[todayStr()];
  return h && h.done;
}

function recordAnswer(id, correct){
  const a = STATE.progress.answered[id] || {correctCount:0, wrongCount:0};
  if(correct) a.correctCount++; else a.wrongCount++;
  a.lastResult = correct;
  STATE.progress.answered[id] = a;
  STATE.progress.totalAnswered = (STATE.progress.totalAnswered||0)+1;
  if(correct) STATE.progress.totalCorrect = (STATE.progress.totalCorrect||0)+1;
}

function completeSession(score, total){
  const t = todayStr();
  STATE.progress.history[t] = {done:true, score, total};
  const streak = STATE.progress.streak;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(streak.lastDate === y || streak.lastDate === t){
    if(streak.lastDate !== t) streak.current += 1;
  } else {
    streak.current = 1;
  }
  streak.lastDate = t;
  streak.longest = Math.max(streak.longest, streak.current);
  saveProgress();
}

function renderTodayView(){
  const deepDiveHtml = renderDeepDiveCard();
  if(isTodayDone() && STATE.sessionIdx === 0 && STATE.sessionAnswers.length===0){
    const h = STATE.progress.history[todayStr()];
    return `
    ${deepDiveHtml}
    <div class="card done-banner">
      <div class="big">✅</div>
      <h3>Today's session complete</h3>
      <p>Score: ${h.score}/${h.total}. Come back tomorrow for the next set — or head to Explore to browse any topic freely.</p>
    </div>
    <button class="btn ghost" onclick="setView('explore')">BROWSE TOPICS</button>`;
  }

  if(STATE.sessionQueue.length === 0){
    STATE.sessionQueue = getDailySession();
    STATE.sessionIdx = 0;
    STATE.sessionAnswers = [];
  }

  if(STATE.sessionIdx >= STATE.sessionQueue.length){
    const correct = STATE.sessionAnswers.filter(a=>a.correct!==false).length;
    const total = STATE.sessionQueue.length;
    completeSession(correct, total);
    return `
    ${deepDiveHtml}
    <div class="card done-banner">
      <div class="big">🎯</div>
      <h3>Session complete</h3>
      <p>You scored ${correct}/${total} today. Streak is now ${STATE.progress.streak.current} day(s). See you tomorrow.</p>

    <button class="btn ghost" onclick="STATE.sessionQueue=[]; STATE.sessionAnswers=[]; render();">BACK TO TODAY</button>`;
  }

  const item = STATE.sessionQueue[STATE.sessionIdx];
  const pct = Math.round((STATE.sessionIdx/STATE.sessionQueue.length)*100);
  let body = '';
  if(item.type==='mcq') body = renderMcq(item, 'session');
  else if(item.type==='flash') body = renderFlash(item, 'session');
  else if(item.type==='lesson') body = renderLesson(item, 'session');

  return `
  ${STATE.sessionIdx===0 ? deepDiveHtml : ''}
  <div class="section-label">Today's session — ${STATE.sessionIdx+1} of ${STATE.sessionQueue.length}</div>
  <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
  ${body}`;
}

  document.getElementById('fc-'+id).classList.toggle('flip');
};

window.answerMcq = function(id, choice, mode){
  const item = CONTENT.find(c=>c.id===id);
  const correct = choice === item.a;
  const optsDiv = document.getElementById('opts-'+id);
  Array.from(optsDiv.children).forEach((btn,i)=>{
    btn.onclick = null;
    if(i===item.a) btn.classList.add('correct');
    else if(i===choice) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  document.getElementById('explain-'+id).innerHTML = `<div class="explain"><b>${correct?'Correct.':'Not quite.'}</b> ${item.e}</div>`;
  recordAnswer(id, correct);
  saveProgress();
  if(mode==='session'){
    STATE.sessionAnswers.push({id, correct});
    injectNextButton();
  }
};

window.answerFlash = function(id, gotIt, mode){
  recordAnswer(id, gotIt);
  saveProgress();
  if(mode==='session'){
    STATE.sessionAnswers.push({id, correct:gotIt});
    render();
    setTimeout(()=>{ STATE.sessionIdx++; render(); }, 150);
  }
};

function injectNextButton(){
  const view = document.querySelector('.view');
  if(view.querySelector('.next-btn')) return;
  const btn = document.createElement('button');
  btn.className='btn next-btn';
  btn.textContent = STATE.sessionIdx < STATE.sessionQueue.length-1 ? 'NEXT →' : 'FINISH SESSION';
  btn.onclick = ()=>{ STATE.sessionIdx++; render(); };
  view.appendChild(btn);
}

        <span class="ic">${c.icon}</span>
        <div class="nm">${c.name}</div>
        <div class="cnt">${cnt} items</div>
      </button>`;
    }).join('');
    return `<div class="section-label">Browse by topic</div><div class="catgrid">${cards}</div>`;
  }
  const items = CONTENT.filter(i=>i.cat===STATE.exploreCat);
  const html = items.map(item=>{
    if(item.type==='mcq') return renderMcq(item,'explore');
    if(item.type==='flash') return renderFlash(item,'explore');
    if(item.type==='lesson') return renderLesson(item,'explore');
  }).join('');
  return `
  <button class="backbtn" onclick="STATE.exploreCat=null; render();">← All topics</button>
  <div class="section-label">${CATS[STATE.exploreCat].icon} ${CATS[STATE.exploreCat].name}</div>
  ${html}`;
}
window.openCat = function(key){ STATE.exploreCat = key; render(); };

function renderProgressView(){
  const p = STATE.progress;
  const total = p.totalAnswered||0;
  const correct = p.totalCorrect||0;
  const acc = total>0 ? Math.round((correct/total)*100) : 0;
  const daysActive = Object.values(p.history).filter(h=>h.done).length;

  const catRows = Object.entries(CATS).map(([key,c])=>{
    const catItems = CONTENT.filter(i=>i.cat===key).map(i=>i.id);
    let seen=0, right=0;
    catItems.forEach(id=>{
      const a = p.answered[id];
      if(a){ seen++; if((a.correctCount||0) > (a.wrongCount||0)) right++; }
    });
    const pct = catItems.length>0 ? Math.round((seen/catItems.length)*100) : 0;
    return `
    <div class="catbar-row">
      <div class="catbar-head"><span>${c.icon} ${c.name}</span><span>${seen}/${catItems.length} seen</span></div>
      <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  // last 28 days calendar
  const cells = [];
  for(let i=27;i>=0;i--){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    const done = p.history[d] && p.history[d].done;
    const isToday = d===todayStr();
    cells.push(`<div class="cal-cell ${done?'done':''} ${isToday?'today':''}"></div>`);
  }

  return `
  <div class="section-label">Your progress</div>
  <div class="statgrid">
    <div class="statbox"><div class="n">${p.streak.current}</div><div class="l">Day streak</div></div>
    <div class="statbox"><div class="n">${p.streak.longest}</div><div class="l">Longest streak</div></div>
    <div class="statbox"><div class="n">${daysActive}</div><div class="l">Days active</div></div>
    <div class="statbox"><div class="n">${acc}%</div><div class="l">Accuracy (${total} answered)</div></div>
  </div>
  <div class="section-label">Topic coverage</div>
  ${catRows}
  <div class="section-label">Last 28 days</div>
  <div class="calendar">${cells.join('')}</div>
  <p style="font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:10px; line-height:1.6;">Saturdays automatically pull in items you previously got wrong for spaced review.</p>
  `;
}

function render(){
  const app = document.getElementById('app');
  let viewHtml = '';
  if(STATE.view==='today') viewHtml = renderTodayView();
  else if(STATE.view==='explore') viewHtml = renderExploreView();
  else if(STATE.view==='progress') viewHtml = renderProgressView();

  app.innerHTML = `
    ${renderTitleBlock()}
    <div class="view">${viewHtml}</div>
    ${renderTabs()}
  `;
  hydrateImages();
}

    scope: '.',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#0A2647',
    theme_color: '#0A2647',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png' },
      { src: icon192, sizes: '512x512', type: 'image/png' }
    ]
  };
  try{
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  }catch(e){ /* manifest not supported in this context, harmless */ }
}
setupManifest();
